<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HPG CRM</title>
<meta name="theme-color" content="#13284F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313284F'/%3E%3Cg transform='translate(14 10) scale(0.081)' fill='%23C4986A'%3E%3Cpath d='M7 9H116V598L7 675Z M187 87H262V415L187 468Z M336 9H444V364L336 441Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar navy cố định + vùng làm việc sáng; vàng gold chỉ dùng cho nhận diện và điểm nhấn */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EEF1F6; --line:#DDE3EC; --line-2:#C9D2DF;
  --ink:#0F1B33; --muted:#5B6780; --faint:#8A94A8;
  --navy:#13284F; --navy-2:#1B3463; --navy-ink:#C9D3E6;
  --accent:#1F3F7A; --accent-ink:#FFFFFF; --accent-soft:#E3EAF6;
  --gold:#C4986A; --gold-ink:#8A6230; --gold-soft:#F6EEE3;
  --pos:#1E7A4F; --pos-soft:#E1F2E9; --neg:#B4382A; --neg-soft:#F9E3E0;
  --warn:#9A6500; --warn-soft:#FBF0D9; --idle:#6B7488; --idle-soft:#E9ECF2;
  --c-thu:#2F5597; --c-chi:#C08A4E;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 2px 8px rgba(15,27,51,.04);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --side:252px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121C30; --sunk:#0E1728; --line:#22304A; --line-2:#2E3E5C;
  --ink:#E6EBF5; --muted:#93A0B8; --faint:#6D7A93;
  --navy:#0A1630; --navy-2:#13254A; --navy-ink:#AEBBD3;
  --accent:#7FA2E0; --accent-ink:#0B1220; --accent-soft:#1A2A4A;
  --gold:#D2A877; --gold-ink:#D9B285; --gold-soft:#2E2516;
  --pos:#4FC08A; --pos-soft:#12301F; --neg:#EE8A7A; --neg-soft:#3A1E1B;
  --warn:#E2B44F; --warn-soft:#33280F; --idle:#97A0B3; --idle-soft:#1E2738;
  --c-thu:#5F8BD6; --c-chi:#C2853F;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121C30; --sunk:#0E1728; --line:#22304A; --line-2:#2E3E5C;
  --ink:#E6EBF5; --muted:#93A0B8; --faint:#6D7A93;
  --navy:#0A1630; --navy-2:#13254A; --navy-ink:#AEBBD3;
  --accent:#7FA2E0; --accent-ink:#0B1220; --accent-soft:#1A2A4A;
  --gold:#D2A877; --gold-ink:#D9B285; --gold-soft:#2E2516;
  --pos:#4FC08A; --pos-soft:#12301F; --neg:#EE8A7A; --neg-soft:#3A1E1B;
  --warn:#E2B44F; --warn-soft:#33280F; --idle:#97A0B3; --idle-soft:#1E2738;
  --c-thu:#5F8BD6; --c-chi:#C2853F;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.code{font-family:var(--f-code);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.sub{display:block;font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- khung ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.tag-step{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-soft);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}.prog .bar i.full{background:var(--pos)}.prog span{font-size:12px;color:var(--muted);white-space:nowrap}
.jr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.js{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:start;background:var(--surface)}
.js:first-child{border-top:0}
.js.cur{background:var(--gold-soft)}
.jchk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700;margin-top:1px;padding:0}
.jchk:hover{border-color:var(--accent)}
.js.done .jchk{background:var(--pos);border-color:var(--pos);color:#fff}
.js.done .jt{color:var(--muted);text-decoration:line-through;font-weight:500}
.js.done{padding-block:7px}
.js.cur .jchk{border-color:var(--gold)}
.jt{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jt .now{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-ink)}
.jx{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.jin{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;font-size:12px;color:var(--ink);min-width:0}
.jin:hover,.jin:focus{border-color:var(--line-2);background:var(--surface);outline:none}
.jnote{width:100%;margin-top:4px;color:var(--muted)}
.js .over{color:var(--neg);font-weight:600}
.jdel{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:2px 4px;border-radius:4px}
.jdel:hover{color:var(--neg);background:var(--neg-soft)}
.jadd{display:flex;gap:8px;margin-top:8px}
.doc-grid{display:flex;flex-direction:column;gap:14px}
.doc-cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-ink);font-weight:700;display:flex;gap:8px;align-items:center}
.doc-cat .n{color:var(--muted);font-weight:600}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
.doc .th{aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:grid;place-items:center;color:var(--faint);cursor:pointer;overflow:hidden}
.doc .th img{width:100%;height:100%;object-fit:cover;display:block}
a.btn{text-decoration:none;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.doc .th .ext.drive{color:var(--accent);background:var(--accent-soft)}
.doc .th .ext{font-family:var(--f-code);font-size:12px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:6px 10px}
.doc .dm{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.doc .dn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .ds{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .da{display:flex;gap:2px;padding:0 6px 6px}
.doc .da .btn{padding:2px 8px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip b{font-weight:600;margin-left:4px}
.upl-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.upl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;align-items:center}
.upl-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl-item .st{font-size:12px;color:var(--muted)}.upl-item .st.ok{color:var(--pos)}.upl-item .st.err{color:var(--neg)}
.detail .docs{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}.detail .doc .th{aspect-ratio:3/2}
.tabs-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs-row .chip{font-weight:500}
th.grp{text-align:center;background:var(--gold-soft);color:var(--gold-ink);border-bottom:1px solid var(--line)}
th.sub2{font-size:10.5px}
.ledger td,.ledger th{padding:9px 10px}
.ledger td,.ledger th{white-space:nowrap}.ledger th.c,.ledger td.c{text-align:center}.ledger th.r{text-align:right}
.chi-lines{display:flex;flex-direction:column;gap:8px}
.chi-line{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr) minmax(0,1fr) 28px;gap:8px;align-items:center}
.chi-head{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr) minmax(0,1fr) 28px;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.chi-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.chi-foot b{font-variant-numeric:tabular-nums}
@media (max-width:560px){.chi-line{grid-template-columns:minmax(0,1fr) 28px}.chi-line .cl-amt,.chi-line .cl-note{grid-column:1}.chi-head{display:none}}
.form label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.form label.chk input{width:16px;height:16px;accent-color:var(--accent)}.ledger td .cell2 small{white-space:normal;max-width:220px}
.pl td:first-child{min-width:240px}
.ledger td.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger td.muted{color:var(--faint)}
.inst{display:inline-block;min-width:22px;text-align:center;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:1px 6px}
.cell2{display:flex;flex-direction:column;gap:1px}.cell2 small{color:var(--muted);font-size:11px}
.pl td,.pl th{padding:9px 14px}
.pl td.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl tr.subrow td:first-child{padding-left:34px;color:var(--muted)}
.pl tr.subrow td{font-size:13px;color:var(--muted)}
.pl tr.tot td{font-weight:700;background:var(--sunk)}
.pl tr.grand td{font-weight:700;background:var(--navy);color:#fff;border-bottom:0}
.pl tr.grand td.money{color:var(--gold)}
.pl tr.pct td{font-size:12px;color:var(--muted);font-style:italic}
.pl tr.minus td:first-child::before{content:"(−) ";color:var(--muted)}
.pl tr.eq td:first-child::before{content:"= ";color:var(--muted)}
.subform{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.subform.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.subform,.subform.two{grid-template-columns:minmax(0,1fr)}}
.einfo{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.einfo div{background:var(--sunk);padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.einfo span{font-size:11px;color:var(--muted)}.einfo b{font-size:14px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.einfo{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;color:#fff;text-decoration:none}
.logo svg{width:26px;height:40px;color:var(--gold);flex:none}
.logo b{display:block;font-size:14px;letter-spacing:.28em;font-weight:700;color:var(--gold)}
.logo span{display:block;font-size:11px;letter-spacing:.16em;color:var(--navy-ink);text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:rgba(201,211,230,.55);padding:14px 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--navy-ink);padding:9px 10px;border-radius:8px;text-align:left;font-weight:500;position:relative}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:12px;color:var(--navy-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot button{border:1px solid rgba(255,255,255,.14);background:none;color:var(--navy-ink);border-radius:8px;padding:6px 10px;font-size:12.5px;text-align:left}
.side-foot button:hover{color:#fff;border-color:rgba(255,255,255,.3)}

.main{min-width:0;display:flex;flex-direction:column}
.page{width:100%;max-width:1240px;margin:0 auto;padding-block:26px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:15;height:auto;flex-direction:row;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));overflow:hidden}
  .logo{padding:0 6px 0 0}.logo svg{width:18px;height:28px}.logo span{display:none}.logo b{font-size:12px;letter-spacing:.22em}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .nav .grp{display:none}
  .nav button{width:auto;white-space:nowrap;padding:7px 10px;font-size:13px}
  .nav button svg{display:none}
  .nav button[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:0;width:auto;height:2px;border-radius:2px}
  .side-foot{display:none}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
  .ph h1{font-size:19px}
  .m-only{display:inline-flex!important}
}
.m-only{display:none!important}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1205}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--neg)}
.btn.danger.arm{background:var(--neg);border-color:var(--neg);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.ctl{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
select.ctl{width:auto}
textarea.ctl{resize:vertical;min-height:70px}
.ctl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .ctl{flex:1 1 170px;width:auto}
.filters .grow{flex:3 1 240px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px 0}
.card-h h2{margin:0;font-size:14.5px;font-weight:600}
.card-h p{margin:0;color:var(--muted);font-size:12.5px}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 18px 18px}
.row{display:grid;gap:20px;align-items:start}
.r-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.r-12{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media (max-width:1060px){.r-2,.r-21,.r-12{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--navy);border-color:color-mix(in srgb,var(--gold) 35%,var(--navy));color:#fff}
.kpi.hl .l,.kpi.hl .s{color:var(--navy-ink)}
.kpi.hl .v{color:var(--gold)}
.delta{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.delta.up{background:var(--pos-soft);color:var(--pos)} .delta.dn{background:var(--neg-soft);color:var(--neg)}
.kpi.alert .v{color:var(--neg)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>:last-child:nth-child(odd){grid-column:1/-1}.kpi .v{font-size:19px}}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0;background:var(--sunk)}
.card .tbl-wrap{border-top:1px solid var(--line);margin-top:14px}
.card .tbl-wrap:first-child{border-top:0;margin-top:0}
.cell-main{font-weight:500}

/* ---------- chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--idle-soft);color:var(--idle)}

.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tagbox{display:flex;gap:6px;flex-wrap:wrap}
.tagbox .chip{font-size:12.5px;padding:4px 10px}
.tagbox .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.fresh{background:var(--neg-soft);color:var(--neg);font-weight:700;letter-spacing:.02em}
.grp-h.fresh{color:var(--neg);background:var(--neg-soft)}
.pill.st-new{background:var(--accent-soft);color:var(--accent)}
.pill.st-wait{background:var(--warn-soft);color:var(--warn)}
.pill.st-won{background:var(--pos-soft);color:var(--pos)}
.pill.thu{background:var(--accent-soft);color:var(--accent)}
.pill.chi{background:var(--gold-soft);color:var(--gold-ink)}
.pri-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.pri-dot.p-hot{background:var(--neg)}.pri-dot.p-warm{background:var(--warn)}.pri-dot.p-cold{background:var(--c-thu)}
.due{font-size:12px;font-weight:600;white-space:nowrap}
.due.over{color:var(--neg)}.due.today{color:var(--warn)}.due.soon{color:var(--accent)}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:11px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px}
.barrow .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.barrow .fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.f-won{background:var(--pos)}.fill.f-off{background:var(--idle)}.fill.f-chi{background:var(--c-chi)}.fill.f-gold{background:var(--gold)}

/* ---------- charts ---------- */
.chart-wrap{overflow-x:auto}.chart{width:100%;min-width:460px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .grid.base{stroke:var(--line-2)}
.chart .ax{fill:var(--faint);font-size:10px;font-variant-numeric:tabular-nums}.chart .lbl{fill:var(--ink);font-size:11px;font-weight:600}
.s-thu{fill:var(--c-thu);background:var(--c-thu)}.s-chi{fill:var(--c-chi);background:var(--c-chi)}.s-pos{fill:var(--accent)}.s-neg{fill:var(--neg)}
.chart .hit{fill:transparent}.chart .hit:hover{fill:var(--ink);fill-opacity:.04}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}
i.k{display:inline-block;width:10px;height:10px;border-radius:3px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:12px;display:grid;grid-template-columns:auto auto;gap:3px 16px;box-shadow:0 6px 20px rgba(15,27,51,.16);max-width:270px}
.tip>b:first-child{grid-column:1/-1;margin-bottom:2px}.tip span{color:var(--muted);display:inline-flex;align-items:center;gap:6px}.tip .num{text-align:right}

/* ---------- tasks ---------- */

.task .t-meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.task .t-act{display:flex;gap:6px;align-items:center}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--sunk);border-top:1px solid var(--line);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grp-h:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.grp-h .n{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.grp-h.over{color:var(--neg)}.grp-h.today{color:var(--warn)}

/* ---------- kanban ---------- */
.sec-lane{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.sec-lane h2{margin:0;font-size:14.5px}.sec-lane p{margin:0;color:var(--muted);font-size:12.5px}

.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}

.kcard .k3{display:flex;justify-content:space-between;gap:8px;font-size:12px;align-items:center}

/* ---------- empty ---------- */

/* ---------- modal ---------- */

.form .hint{font-size:12px;color:var(--faint);font-weight:400}
.form .sec-t{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-ink);font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}

.h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0;display:flex;align-items:center;gap:8px}

.ev{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}

.ev .e-b{font-size:13px;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:70;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(8,16,32,.3)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 16px;font-size:13px;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}

code.k{font-family:var(--f-code);font-size:11.5px;background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--ink)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}

@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(10px);opacity:.6}}}
</style>

/* ============ danh mục ============ */
const STATUSES=["1. Mới tiếp nhận","2. Đã liên hệ","3. Đang tư vấn","4. Đã gửi báo giá","5. Chờ quyết định","6. Đã ký hợp đồng","7. Đang triển khai","8. Hoàn thành","9. Tạm dừng","10. Không chốt"];

function fin(list){const r={rev:0,tax:0,cogs:0,opex:0,cogsBy:{},opexBy:{},ck:0,the:0,tm:0};
  for(const e of list){if(e.type==="thu"){r.rev+=e.amount;r.tax+=Number(e.tax)||0;r[e.method||"ck"]=(r[e.method||"ck"]||0)+e.amount}
    else{const g=chiGroup(e);if(g==="tax")r.tax+=e.amount;else if(g==="cogs"){r.cogs+=e.amount;r.cogsBy[e.category]=(r.cogsBy[e.category]||0)+e.amount}else{const k=e.category||"Chi khác";r.opex+=e.amount;r.opexBy[k]=(r.opexBy[k]||0)+e.amount}}}
  r.net=r.rev-r.tax;r.gross=r.net-r.cogs;r.profit=r.gross-r.opex;return r}

function parseMoney(v){

  const m=s.match(/^([\d.,]+)(tỷ|ty|tr|triệu|trieu|m|k|nghìn|ngàn)?$/);

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function last12(){const end=todayISO().slice(0,7);const latest=S.entries.reduce((m,e)=>e.date&&String(e.date).slice(0,7)>m?String(e.date).slice(0,7):m,end);let [y,m]=latest.split("-").map(Number);const out=[];for(let i=0;i<12;i++){out.unshift(`${y}-${String(m).padStart(2,"0")}`);m--;if(!m){m=12;y--}}return out}
const barPath=(x,y,w,h,up)=>{const r=Math.min(4,w/2,Math.abs(h));if(h<=0)return "";return up?`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`:`M${x},${y}V${y+h-r}Q${x},${y+h} ${x+r},${y+h}H${x+w-r}Q${x+w},${y+h} ${x+w},${y+h-r}V${y}Z`};
function chartMonthly(months,byM){
  const W=760,H=250,L=50,R=20,T=14,B=26,pw=W-L-R,ph=H-T-B;const max=niceMax(Math.max(1,...months.map(m=>Math.max(byM[m].thu,byM[m].chi))));
  const gw=pw/months.length,bw=Math.min(16,(gw-12)/2);let g="";
  for(let i=0;i<=4;i++){const v=max*i/4,y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid${i?"":" base"}"/><text x="${L-8}" y="${y+3.5}" text-anchor="end" class="ax">${shortM(v)}</text>`}
  let bars="",hits="";months.forEach((m,i)=>{const cx=L+gw*i+gw/2,d=byM[m],h1=ph*d.thu/max,h2=ph*d.chi/max;
    bars+=`<path d="${barPath(cx-bw-1,T+ph-h1,bw,h1,true)}" class="s-thu"/><path d="${barPath(cx+1,T+ph-h2,bw,h2,true)}" class="s-chi"/><text x="${cx}" y="${H-7}" text-anchor="middle" class="ax">${m.slice(5)}/${m.slice(2,4)}</text>`;
    hits+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ph}" class="hit" data-tip="${esc(`<b>Tháng ${m.slice(5)}/${m.slice(0,4)}</b><span><i class="k s-thu"></i>Thu</span><b class="num">${fmt(d.thu)}</b><span><i class="k s-chi"></i>Chi</span><b class="num">${fmt(d.chi)}</b><span>Lợi nhuận</span><b class="num">${fmt(d.thu-d.chi)}</b>`)}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Thu và chi theo tháng">${g}${bars}${hits}</svg>`;
}
function chartProfit(months,byM){
  const W=560,H=230,L=46,R=22,T=16,B=26,pw=W-L-R,ph=H-T-B;const vals=months.map(m=>byM[m].thu-(byM[m].tax||0)-byM[m].chi);const mx=niceMax(Math.max(1,...vals.map(Math.abs)));const neg=vals.some(v=>v<0);
  const lo=neg?-mx:0,yOf=v=>T+ph*(mx-v)/(mx-lo),zero=yOf(0);let g="";(neg?[-mx,0,mx]:[0,mx/2,mx]).forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${yOf(v)}" y2="${yOf(v)}" class="grid${v===0?" base":""}"/><text x="${L-8}" y="${yOf(v)+3.5}" text-anchor="end" class="ax">${shortM(v)}</text>`});
  const gw=pw/months.length,bw=Math.min(22,gw-12);let bars="",hits="";
  months.forEach((m,i)=>{const v=vals[i],cx=L+gw*i+gw/2,h=Math.abs(yOf(v)-zero);bars+=v>=0?`<path d="${barPath(cx-bw/2,zero-h,bw,h,true)}" class="s-pos"/>`:`<path d="${barPath(cx-bw/2,zero,bw,h,false)}" class="s-neg"/>`;
    if(i===months.length-1&&v)bars+=`<text x="${cx}" y="${v>=0?zero-h-6:zero+h+13}" text-anchor="middle" class="lbl">${shortM(v)}</text>`;
    bars+=`<text x="${cx}" y="${H-7}" text-anchor="middle" class="ax">${m.slice(5)}/${m.slice(2,4)}</text>`;
    hits+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ph}" class="hit" data-tip="${esc(`<b>Tháng ${m.slice(5)}/${m.slice(0,4)}</b><span>Lợi nhuận</span><b class="num">${fmt(v)}</b><span>Biên</span><b class="num">${byM[m].thu?(v/byM[m].thu*100).toFixed(0)+"%":"—"}</b>`)}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Lợi nhuận theo tháng">${g}${bars}${hits}</svg>`;
}

/* ============ VIEW: Hành trình hồ sơ ============ */
function journeyRows(owner){
  const t=todayISO();
  return [...S.clients.values()].filter(c=>(SIGNED.has(c.status)||jOf(c).length)&&!/^(9|10)\./.test(c.status||"")&&(!owner||c.owner===owner)).map(c=>{const st=jState(c);const due=st.cur?.due||"";return {c,st,due,over:due&&due<t}})
    .sort((a,b)=>(!!b.st.cur-!!a.st.cur)||(b.over-a.over)||((a.due||"9")).localeCompare(b.due||"9")||a.c.id.localeCompare(b.c.id));
}
function journeyTable(rows,compact){
  const at=allTime();
  return `<div class="tbl-wrap"><table style="min-width:${compact?640:860}px"><thead><tr><th>Khách</th>${compact?"":"<th>Dịch vụ</th>"}<th>Tiến độ</th><th>Đang làm</th><th>Hạn</th>${compact?"":'<th class="r">Còn phải thu</th><th>Phụ trách</th>'}</tr></thead><tbody>
  ${rows.map(({c,st,due})=>{const d=dueInfo(due);const left=Math.max(0,(c.contractValue||0)-(at[c.id]?.thu||0));return `<tr class="click" data-client="${esc(c.id)}"><td><span class="cell-main">${esc(c.contact||c.id)}</span> <span class="code">${esc(c.id)}</span><span class="sub">${esc(c.facility||"")}</span></td>${compact?"":`<td><span class="sub" style="color:var(--ink)">${esc(c.service||"—")}</span></td>`}<td>${st.total?progHtml(st):`<button class="btn sm" type="button" data-jnew="${esc(c.id)}">Tạo hành trình</button>`}</td><td>${st.cur?esc(st.cur.t):st.total?'<span class="pill st-won">Hoàn tất</span>':"—"}</td><td>${d?`<span class="due ${d.cls}">${d.txt}</span>`:st.cur?'<span class="sub" style="display:inline">Chưa đặt hạn</span>':"—"}</td>${compact?"":`<td class="r num ${left?"neg":""}">${left?fmt(left):"—"}</td><td>${esc(c.owner||"—")}</td>`}</tr>`}).join("")}
  </tbody></table></div>`;
}

/* ============ Theo giai đoạn (bảng kéo thả) ============ */
const colLabel=s=>({"7. Đang triển khai":"Đang xử lý hồ sơ","8. Hoàn thành":"Hoàn tất hồ sơ"}[s]||s.replace(/^\d+\.\s*/,""));
function boardHtml(owner){
  const cols=STATUSES.slice(0,8);const closed=STATUSES.slice(8);
  const by=s=>sortedClients().filter(c=>c.status===s&&(!owner||c.owner===owner));
  const lane=(title,sub,cs)=>`<div style="display:flex;flex-direction:column;gap:10px"><div class="sec-lane"><h2>${title}</h2><p>${sub}</p></div><div class="kanban" style="grid-auto-flow:row;grid-template-columns:repeat(${cs.length},minmax(200px,1fr))">${cs.map(s=>{const list=by(s);const v=list.reduce((a,c)=>a+(c.contractValue||0),0);return `<section class="col" data-col="${esc(s)}"><div class="col-h"><b>${esc(colLabel(s))}<span class="n">${list.length}</span></b><span class="num">${v?fmtM(v):"—"}</span></div><div class="col-b">${list.map(kcard).join("")}</div></section>`}).join("")}</div></div>`;
  return lane("Giai đoạn chốt khách","Từ tiếp nhận đến khi khách quyết định",cols.slice(0,5))+lane("Sau khi ký hợp đồng","Đã ký → đang xử lý hồ sơ → hoàn tất · thẻ hiện bước hồ sơ đang làm",cols.slice(5))+`
  <section class="card"><div class="card-h"><h2>Dừng / không chốt</h2><p>Khách tạm dừng hoặc không ký</p></div><div class="card-b"><div class="filters">${closed.map(s=>`<span class="pill">${esc(s)} · ${by(s).length}</span>`).join("")}<button class="btn sm ghost" type="button" data-goto-closed>Xem danh sách</button></div></div></section>`;
}

/* ============ VIEW: Báo cáo lợi nhuận ============ */
function reportMonths(){
  const t=todayISO().slice(0,7);
  if(S.period.length===7)return [S.period];
  if(S.period.length===4){const y=S.period,last=y===t.slice(0,4)?+t.slice(5):12;return Array.from({length:last},(_,i)=>`${y}-${String(i+1).padStart(2,"0")}`)}
  const ms=last12();const first=ms.findIndex(m=>S.entries.some(e=>String(e.date).startsWith(m)));return first<0?ms.slice(-3):ms.slice(first);
}
function chartWaterfall(f){
  const steps=[["Doanh thu",f.rev,"tot"],["Thuế",-f.tax,"d"],["Giá vốn dịch vụ",-f.cogs,"d"],["Chi phí vận hành",-f.opex,"d"],["Lợi nhuận",f.profit,"end"]];
  const W=640,H=240,L=8,R=8,T=22,B=40,pw=W-L-R,ph=H-T-B;const mx=niceMax(Math.max(1,f.rev,f.profit));const mn=Math.min(0,f.profit);const y=v=>T+ph*(mx-v)/(mx-mn);
  const gw=pw/steps.length,bw=Math.min(78,gw-26);let run=0,out="";
  steps.forEach(([lb,v,k],i)=>{const x=L+gw*i+(gw-bw)/2;let a,b,cls;if(k==="tot"){a=0;b=v;run=v;cls="s-thu"}else if(k==="d"){a=run+v;b=run;run=a;cls="s-chi"}else{a=Math.min(0,v);b=Math.max(0,v);cls=v<0?"s-neg":"s-pos"}
    const top=y(b),hgt=Math.max(1,y(a)-y(b));out+=`<rect x="${x}" y="${top}" width="${bw}" height="${hgt}" rx="4" class="${cls}"/>`;
    out+=`<text x="${x+bw/2}" y="${top-6}" text-anchor="middle" class="lbl">${k==="d"&&v?"−":""}${shortM(Math.abs(v))}</text><text x="${x+bw/2}" y="${H-22}" text-anchor="middle" class="ax">${lb}</text>${f.rev&&k!=="tot"?`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="ax">${(Math.abs(v)/f.rev*100).toFixed(0)}%</text>`:""}`;
    if(i<steps.length-1)out+=`<line x1="${x+bw}" x2="${x+gw}" y1="${y(run)}" y2="${y(run)}" class="grid"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Từ doanh thu đến lợi nhuận"><line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" class="grid base"/>${out}</svg>`;
}
function vReports(){
  const view=S.rView||"pl";const all=S.entries.filter(e=>inPeriod(e.date));const F=fin(all);const pct=v=>F.rev?(v/F.rev*100).toFixed(1).replace(".",",")+"%":"—";
  const toggle=`<div class="tabs-row"><button class="chip" type="button" data-rview="pl" aria-pressed="${view==="pl"}">Cách 1 · Kết quả kinh doanh</button><button class="chip" type="button" data-rview="hd" aria-pressed="${view==="hd"}">Cách 2 · Lợi nhuận theo hợp đồng</button></div>`;
  const kpis=`<section class="kpis"><div class="card kpi"><span class="l">Doanh thu</span><span class="v num">${fmtM(F.rev)}</span><span class="s">Khách thanh toán</span></div><div class="card kpi"><span class="l">Thuế</span><span class="v num">${fmtM(F.tax)}</span><span class="s">${pct(F.tax)} doanh thu</span></div><div class="card kpi"><span class="l">Giá vốn dịch vụ</span><span class="v num">${fmtM(F.cogs)}</span><span class="s">Lệ phí, thẩm định, cost DV</span></div><div class="card kpi"><span class="l">Chi phí vận hành</span><span class="v num">${fmtM(F.opex)}</span><span class="s">Quảng cáo, nội bộ, khác</span></div><div class="card kpi hl"><span class="l">Lợi nhuận ròng</span><span class="v num">${fmtM(F.profit)}</span><span class="s">Biên ${pct(F.profit)}</span></div></section>`;
  let body="";
  if(view==="pl"){
    const ms=reportMonths();const FM=ms.map(m=>fin(S.entries.filter(e=>String(e.date).startsWith(m))));
    const cogsK=[...new Set([...CAT_CHI.filter(c=>COGS_CATS.has(c)),...Object.keys(F.cogsBy)])].filter(k=>F.cogsBy[k]);const opexK=[...new Set([...CAT_CHI.filter(c=>!COGS_CATS.has(c)),...Object.keys(F.opexBy)])].filter(k=>F.opexBy[k]);
    const row=(cls,label,get,opt={})=>`<tr class="${cls}"><td>${label}</td>${FM.map(fm=>`<td class="money">${opt.p?(fm.rev?(get(fm)/fm.rev*100).toFixed(1).replace(".",",")+"%":"—"):money(get(fm))||"—"}</td>`).join("")}<td class="money" style="font-weight:600">${opt.p?pct(get(F)):fmt(get(F))}</td><td class="money">${opt.p||opt.nop?"":pct(get(F))}</td></tr>`;
    body=`<div style="display:flex;flex-direction:column;gap:20px">
      <section class="card"><div class="card-h"><h2>Từ doanh thu đến lợi nhuận</h2><p>${periodLabel()}</p></div><div class="card-b"><div class="chart-wrap" style="max-width:820px">${chartWaterfall(F)}</div><p class="sub" style="margin-top:6px">Mỗi 100 đồng khách trả: ${F.rev?`${Math.round(F.tax/F.rev*100)} đồng thuế, ${Math.round(F.cogs/F.rev*100)} đồng giá vốn, ${Math.round(F.opex/F.rev*100)} đồng vận hành, còn lại <b style="color:var(--ink)">${Math.round(F.profit/F.rev*100)} đồng lợi nhuận</b>.`:"chưa có doanh thu."}</p></div></section>
      <section class="card"><div class="card-h"><h2>Báo cáo kết quả kinh doanh</h2><p>Theo tháng · ${periodLabel()}</p></div>
      <div class="tbl-wrap" style="margin-top:14px"><table class="pl" style="min-width:${380+ms.length*110}px"><thead><tr><th>Khoản mục</th>${ms.map(m=>`<th class="r">${m.slice(5)}/${m.slice(2,4)}</th>`).join("")}<th class="r">Tổng</th><th class="r">% DT</th></tr></thead><tbody>
        ${row("tot","Doanh thu (khách thanh toán)",f=>f.rev)}
        ${row("minus","Thuế",f=>f.tax)}
        ${row("tot eq","Doanh thu sau thuế",f=>f.net)}
        ${row("minus","Giá vốn dịch vụ",f=>f.cogs)}
        ${cogsK.map(k=>row("subrow",esc(k),f=>f.cogsBy[k]||0)).join("")}
        ${row("tot eq","Lợi nhuận gộp",f=>f.gross)}
        ${row("pct","Biên lợi nhuận gộp",f=>f.gross,{p:1})}
        ${row("minus","Chi phí vận hành",f=>f.opex)}
        ${opexK.map(k=>row("subrow",esc(k),f=>f.opexBy[k]||0)).join("")}
        ${row("grand eq","Lợi nhuận ròng",f=>f.profit)}
        ${row("pct","Biên lợi nhuận ròng",f=>f.profit,{p:1})}
      </tbody></table></div></section></div>`;
  }else{
    const at=allTime();const per={};all.forEach(e=>{const k=e.clientId||"";(per[k]??=[]).push(e)});
    const rows=Object.entries(per).filter(([k])=>k).map(([k,l])=>{const f=fin(l);const fee=l.filter(e=>e.type==="chi"&&FEE_CATS.has(e.category)).reduce((a,e)=>a+e.amount,0);const c=S.clients.get(k)||{};return {k,c,f,fee,other:f.cogs+f.opex-fee,left:Math.max(0,(c.contractValue||0)-(at[k]?.thu||0))}}).sort((a,b)=>b.f.profit-a.f.profit);
    const general=fin(per[""]||[]);const T=rows.reduce((t,r)=>{t.hd+=r.c.contractValue||0;t.rev+=r.f.rev;t.tax+=r.f.tax;t.fee+=r.fee;t.other+=r.other;t.p+=r.f.profit;t.left+=r.left;return t},{hd:0,rev:0,tax:0,fee:0,other:0,p:0,left:0});
    body=`<section class="card"><div class="card-h"><h2>Lợi nhuận theo hợp đồng</h2><p>${periodLabel()} · mỗi khách: doanh thu − thuế − lệ phí, thẩm định − cost dịch vụ</p></div>
      <div class="tbl-wrap" style="margin-top:14px"><table class="pl" style="min-width:1180px"><thead><tr><th>Tên KH / công ty</th><th>Dịch vụ</th><th class="r">Tổng HĐ</th><th class="r">Đã thu</th><th class="r">Thuế</th><th class="r">DT sau thuế</th><th class="r">Lệ phí &amp; phí thẩm định</th><th class="r">Cost DV &amp; chi khác</th><th class="r">Lợi nhuận</th><th class="r">Biên</th><th class="r">Còn phải thu</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click" data-client="${esc(r.k)}"><td><span class="cell-main">${esc(r.c.contact||r.k)}</span> <span class="code">${esc(r.k)}</span><span class="sub">${esc(r.c.facility&&!/chưa có tên/i.test(r.c.facility)?r.c.facility:"")}</span></td><td><span class="sub" style="color:var(--ink)">${esc(r.c.service||"")}</span></td><td class="money">${money(r.c.contractValue)||"—"}</td><td class="money">${fmt(r.f.rev)}</td><td class="money">${money(r.f.tax)||"—"}</td><td class="money">${fmt(r.f.net)}</td><td class="money">${money(r.fee)||"—"}</td><td class="money">${money(r.other)||"—"}</td><td class="money ${r.f.profit<0?"neg":""}" style="font-weight:700">${fmt(r.f.profit)}</td><td class="money">${r.f.rev?(r.f.profit/r.f.rev*100).toFixed(0)+"%":"—"}</td><td class="money ${r.left?"neg":""}">${r.left?fmt(r.left):"—"}</td></tr>`).join("")||`<tr><td colspan="11" class="sub">Chưa có thu chi gắn với khách trong kỳ.</td></tr>`}
      <tr class="tot"><td colspan="2">Cộng các hợp đồng</td><td class="money">${fmt(T.hd)}</td><td class="money">${fmt(T.rev)}</td><td class="money">${fmt(T.tax)}</td><td class="money">${fmt(T.rev-T.tax)}</td><td class="money">${fmt(T.fee)}</td><td class="money">${fmt(T.other)}</td><td class="money">${fmt(T.p)}</td><td class="money">${T.rev?(T.p/T.rev*100).toFixed(0)+"%":"—"}</td><td class="money">${fmt(T.left)}</td></tr>
      <tr class="minus"><td colspan="8">Chi phí chung không gắn khách (quảng cáo tìm khách, nội bộ…)</td><td class="money">${fmt(general.cogs+general.opex+general.tax-general.rev)}</td><td colspan="2"></td></tr>
      <tr class="grand eq"><td colspan="8">Lợi nhuận ròng</td><td class="money">${fmt(F.profit)}</td><td class="money">${pct(F.profit).replace(",0%","%")}</td><td></td></tr>
      </tbody></table></div></section>`;
  }
  return pageHead("Báo cáo lợi nhuận","Doanh thu − thuế − giá vốn dịch vụ (lệ phí, phí thẩm định, cost) − chi phí vận hành = lợi nhuận",periodSelect())+kpis+toggle+body;
}

      ${!CLOSED.has(c.status)?`<div class="next"><span class="lbl">Việc cần làm tiếp theo</span><div>${esc(c.nextAction||"Chưa ghi việc cần làm")}</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${d?`<span class="due ${d.cls}">${d.txt}</span>`:`<span class="sub" style="display:inline">Chưa hẹn ngày</span>`}${S.canWrite&&!S.needMigration?`<button class="btn sm pri" type="button" data-log="${esc(id)}" style="margin-left:auto">${ico("chat")}Ghi chăm sóc</button>`:""}</div></div>`:""}

      ${evs.length?`<div class="timeline">${evs.map(ev=>ev.k==="a"?`<div class="ev"><span class="dot"></span><div><div class="e-h"><b>${esc(ev.a.channel||"Chăm sóc")}</b><span>${dmy(ev.a.date)}</span>${ev.a.by&&ev.a.by!==NOTE_MARK?`<span>${esc(ev.a.by)}</span>`:""}</div><div class="e-b">${esc(ev.a.content||"")}</div>${ev.a.result?`<div class="e-r">→ ${esc(ev.a.result)}</div>`:""}</div></div>`:`<div class="ev"><span class="dot money"></span><div><div class="e-h"><b style="color:${ev.e.type==="thu"?"var(--c-thu)":"var(--gold-ink)"}">${ev.e.type==="thu"?"Thu":"Chi"} ${fmt(ev.e.amount)} đ</b><span>${dmy(ev.e.date)}</span><span>${esc(ev.e.category||"")}</span>${S.canWrite?`<button class="btn sm ghost" type="button" data-edit="${esc(ev.e.id)}" style="padding:0 6px">Sửa</button>`:""}</div>${ev.e.note?`<div class="e-r">${esc(ev.e.note)}</div>`:""}</div></div>`).join("")}</div>`:`<p class="sub">Chưa có lần chăm sóc hay khoản thu chi nào.</p>`}

/* ============ Kho tài liệu ============ */
function docCard(d,showClient){
  const link=!!d.url;const isDrive=link&&/drive\.google\.com|docs\.google\.com/.test(d.url);
  return `<div class="doc"><div class="th" data-dopen="${esc(d.id)}" title="Mở ${esc(d.name)}">${link?`<span class="ext drive">${isDrive?"DRIVE":"LINK"}</span>`:isImg(d)?`<img alt="" data-thumb="${esc(d.path)}" loading="lazy">`:`<span class="ext">${esc(extOf(d.name))}</span>`}</div>
  <div class="dm"><span class="dn" title="${esc(d.name)}">${esc(d.name)}</span><span class="ds">${showClient?(d.clientId?esc(d.clientId+" · "+clientName(d.clientId)):"Tài liệu chung"):esc(d.docDate?dmy(d.docDate):dmy(new Date(Number(d.createdAt)||Date.now()).toISOString()))} · ${link?(isDrive?"Google Drive":"Liên kết"):fsize(Number(d.size)||0)}</span>${d.note?`<span class="ds" title="${esc(d.note)}">${esc(d.note)}</span>`:""}</div>
  <div class="da"><button class="btn sm ghost" type="button" data-dopen="${esc(d.id)}">${link?"Mở":"Xem"}</button>${link?"":`<button class="btn sm ghost" type="button" data-ddl="${esc(d.id)}">Tải</button>`}${S.canWrite?`<button class="btn sm ghost" type="button" data-dedit="${esc(d.id)}">Sửa</button>`:""}</div></div>`;
}
function docGroups(list,showClient){
  const by={};list.forEach(d=>{(by[d.category||"Khác"]??=[]).push(d)});
  const order=docCats();return `<div class="doc-grid">${Object.keys(by).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(k=>`<div style="display:flex;flex-direction:column;gap:8px"><div class="doc-cat">${esc(k)}<span class="n">${by[k].length}</span></div><div class="docs">${by[k].map(d=>docCard(d,showClient)).join("")}</div></div>`).join("")}</div>`;
}
function vDocs(){
  if(S.needDocs)return pageHead("Kho tài liệu","")+`<section class="card">${emptyBox("folder","Cần nâng cấp cơ sở dữ liệu","Chạy đoạn SQL nâng cấp Kho tài liệu trong Supabase → SQL Editor để bật mục này.")}</section>`;
  const q=norm(S.dq);const base=S.docs.filter(d=>(S.dClient===""||(S.dClient==="_none"?!d.clientId:d.clientId===S.dClient))&&(!q||norm([d.name,d.note,d.clientId,clientName(d.clientId)].join(" ")).includes(q)));
  const list=base.filter(d=>!S.dCat||d.category===S.dCat);const cnt={};base.forEach(d=>cnt[d.category]=(cnt[d.category]||0)+1);
  const total=S.docs.reduce((a,d)=>a+(Number(d.size)||0),0);const nLink=S.docs.filter(d=>d.url).length;
  return pageHead("Kho tài liệu",`${S.docs.length} tài liệu · ${nLink} link Drive · ${fsize(total)} / 1 GB dung lượng Supabase đã dùng`,S.canWrite?`<button class="btn pri" type="button" data-dupload="">${ico("plus")}Thêm tài liệu</button>`:"")+
  `<section class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:12px">
    <div class="filters"><input class="ctl grow" id="dq" type="search" placeholder="Tìm tên file, ghi chú, khách…" value="${esc(S.dq)}"><select class="ctl" id="dClient"><option value="">Mọi khách</option><option value="_none"${S.dClient==="_none"?" selected":""}>Tài liệu chung</option>${sortedClients().map(c=>`<option value="${esc(c.id)}"${c.id===S.dClient?" selected":""}>${esc(c.id)} · ${esc(clientName(c.id))}</option>`).join("")}</select></div>
    <div class="chips"><button class="chip" type="button" data-dcat="" aria-pressed="${!S.dCat}">Tất cả<b>${base.length}</b></button>${docCats().filter(k=>cnt[k]).map(k=>`<button class="chip" type="button" data-dcat="${esc(k)}" aria-pressed="${S.dCat===k}">${esc(k)}<b>${cnt[k]}</b></button>`).join("")}</div>
    ${list.length?docGroups(list,true):emptyBox("folder",S.docs.length?"Không có tài liệu khớp bộ lọc":"Chưa có tài liệu nào","Dán link Google Drive của hợp đồng, hoá đơn, giấy phép (không tốn dung lượng), hoặc tải file trực tiếp.",S.canWrite&&!S.docs.length?`<button class="btn pri" type="button" data-dupload="">Thêm tài liệu</button>`:"")}
  </div></section>`;
}
function docsBlock(c){

async function compressImage(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<800*1024||!window.createImageBitmap)return f;
  try{const bmp=await createImageBitmap(f);const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.82));if(!blob||blob.size>=f.size)return f;return new File([blob],f.name.replace(/\.(png|webp)$/i,".jpg"),{type:"image/jpeg"})}catch{return f}
}

/* ============ ghi chú → nhật ký ============ */
const NOTE_MARK="Từ ghi chú";
function guessChannel(t){t=t.toLowerCase();if(/inbox|trả lời qc|tin nhắn|fanpage|\bfb\b|gửi sđt/.test(t))return "Inbox Facebook";if(/họp|gặp|starbucks|cafe|cà phê|khảo sát/.test(t))return "Gặp trực tiếp";if(/gọi|nghe máy|cuộc gọi|điện thoại/.test(t))return "Gọi điện";if(/zalo/.test(t))return "Zalo";if(/email|mail/.test(t))return "Email";return "Ghi chú"}
function cleanSeg(t){return t.replace(/\s+/g," ").replace(/\(\s*\)/g,"").replace(/\s+([.,;:)])/g,"$1").replace(/^[\s.,;:→>\-–]+|[\s,;:→>\-–(]+$/g,"").trim()}
function parseNote(note,refISO,fallbackISO){
  note=String(note||"").replace(/\r/g,"").trim();if(!note)return [];
  const yr=(refISO||fallbackISO||new Date().toISOString()).slice(0,4);
  const re=/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?(?![\d\/])/g;const hits=[];let m;
  while((m=re.exec(note))){const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)continue;
    const prevEnd=hits.length?hits[hits.length-1].tEnd:0;const before=note.slice(prevEnd,m.index);
    let cut=-1;for(const sp of [". ",".\n","; ","\n","→","->","|"]){const i=before.lastIndexOf(sp);if(i>=0)cut=Math.max(cut,i+sp.length)}
    let start=m.index;const lead=cut>=0?before.slice(cut):before;const endsClause=/^\s*\)?\s*([.;\n]|$)/.test(note.slice(re.lastIndex));if(lead.length<=24||endsClause)start=prevEnd+(cut>=0?cut:0);
    hits.push({start,tStart:m.index,tEnd:re.lastIndex,date:`${m[3]||yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`})}
  const out=[];const pre=cleanSeg(note.slice(0,hits.length?hits[0].start:note.length));
  hits.forEach((h,i)=>{const end=i+1<hits.length?hits[i+1].start:note.length;const txt=cleanSeg(note.slice(h.start,h.tStart)+note.slice(h.tEnd,end));
    const last=out[out.length-1];if(last&&last.date===h.date){if(txt)last.content=cleanSeg(last.content+" · "+txt)}else out.push({date:h.date,content:txt})});
  if(pre)out.unshift({date:fallbackISO||(hits[0]?.date)||refISO,content:pre,undated:true});
  const merged=[];for(const o of out.filter(o=>o.content&&o.date)){const l=merged[merged.length-1];if(l&&l.date===o.date)l.content=cleanSeg(l.content+" · "+o.content);else merged.push({...o})}
  return merged.map(o=>({date:o.date,content:o.content,channel:guessChannel(o.content)}));
}
async function syncNoteActs(id,note,ref,last,next){
  if(S.needMigration)return 0;
  const items=[...parseNote(note,ref,last||ref),...parseNote(next,ref,last||ref).map(x=>({...x,channel:x.channel==="Ghi chú"?"Việc cần làm tiếp theo":x.channel}))];
  const {error:e1}=await sb.from("activities").delete().eq("client_id",id).eq("created_by_email",NOTE_MARK);if(e1)throw dbErr(e1);
  if(items.length){const {error:e2}=await sb.from("activities").insert(items.map((x,i)=>toRow("activities",{clientId:id,date:x.date,channel:x.channel,content:x.content,result:"",by:NOTE_MARK,createdAt:Date.now()+i})));if(e2)throw dbErr(e2)}
  return items.length;
}
async function syncAllNotes(btn){

  try{for(const c of S.clients.values()){if(!c.note&&!c.nextAction)continue;n+=await syncNoteActs(c.id,c.note,c.date,c.lastContact,c.nextAction);k++}}catch(err){writeErr(err)}finally{S.quiet=false;btn.disabled=false;await reload()}
  toast(`Đã tạo ${n} dòng nhật ký từ ghi chú và việc cần làm của ${k} khách`);
}
const noteDate=(iso,ref)=>{const [y,m,d]=iso.split("-");return String(ref||"").startsWith(y)?`${d}/${m}`:`${d}/${m}/${y}`};

    if(!lines.length){toast("Nhập số tiền cho ít nhất một loại chi");return}const base={type:"chi",date,clientId:val("eClient"),method:"",installment:0,tax:0};
    try{if(form.dataset.id){await db.update("entries",form.dataset.id,{...base,...lines[0],updatedAt:Date.now()});closeModal();toast("Đã lưu thay đổi");return}

  const amount=parseMoney(val("eAmt"));if(!amount){toast("Nhập số tiền lớn hơn 0");return}const data={type,date,clientId:val("eClient"),category:type==="thu"?val("eCatThu"):val("eCatChi"),amount,note:val("eNote").trim()};

      if(type==="thu"&&c&&!S.needJourney){const j=jOf(c).map(s=>({...s}));let i=data.installment?j.findIndex(s=>s.st!=="done"&&new RegExp("^Thu tiền đợt "+data.installment+"\\b").test(s.t)):-1;if(i<0)i=j.findIndex(s=>s.st!=="done"&&/^Thu tiền/.test(s.t));if(i>=0){j[i].st="done";j[i].done=data.date;j[i].note=j[i].note||`Đã thu ${fmt(data.amount)} đ`;await sb.from("clients").update({journey:j}).eq("id",c.id);await reload()}}}

async function del(tbl,id,btn,msg){

function parseCSV(text){text=text.replace(/^﻿/,"");const first=text.split("\n")[0];const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=""}else if(ch==="\n"){row.push(cur.replace(/\r$/,""));rows.push(row);row=[];cur=""}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows}
const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const findCol=(h,...keys)=>h.findIndex(x=>keys.some(k=>norm(x).startsWith(norm(k))));

  const col=Object.fromEntries(Object.entries(C).map(([k,v])=>[k,findCol(h,v)]));const g=(r,k)=>col[k]>=0?(r[col[k]]||"").trim():"";
  let n=0,u=0;S.quiet=true;

    const d={date:parseDate(g(r,"date")),contact:g(r,"contact"),status:g(r,"status"),model:g(r,"model"),facility:g(r,"facility"),phone:g(r,"phone"),service:g(r,"service"),source:g(r,"source"),note:g(r,"note"),owner:g(r,"owner"),contractValue:parseMoney(g(r,"value"))};

    const old=S.clients.get(id);const clean=Object.fromEntries(Object.entries(d).filter(([,x])=>x!==""&&x!==0));
    if(old){if(old.contractValue)delete clean.contractValue;await db.update("clients",id,{...clean,updatedAt:Date.now()});u++}else{await db.insert("clients",{id,...d,updatedAt:Date.now()});n++}
    const note=d.note||old?.note||"",nx=d.nextAction||old?.nextAction||"";if(note||nx)await syncNoteActs(id,note,d.date||old?.date,d.lastContact||old?.lastContact,nx);}}

function handleFile(kind,file){if(!file)return;const fr=new FileReader();fr.onload=()=>({clients:importClients,entries:importEntries,acts:importActs}[kind])(fr.result);fr.readAsText(file,"utf-8")}

/* tooltip biểu đồ */
const tipEl=$("#tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest?.("[data-tip]");if(!t){tipEl.hidden=true;return}tipEl.innerHTML=t.dataset.tip;tipEl.hidden=false;const r=tipEl.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;tipEl.style.left=x+"px";tipEl.style.top=y+"px"});
document.addEventListener("scroll",e=>{tipEl.hidden=true;if(S.tagPop&&!$("#tagpop")?.hidden&&!e.target.closest?.("#tagpop"))openTagPop(S.tagPop)},true);

/* ============ kết nối Supabase ============ */
const CFG=window.HPG_CONFIG||{};let sb=null;
const COLS_BASE={clients:["id","date","contact","phone","facility","model","service","status","owner","contract_value","source","note","updated_at"],entries:["id","type","date","client_id","category","amount","note","created_by_email","created_at","updated_at"],activities:["id","client_id","date","channel","content","result","next_date","created_by_email","created_at"]};
const COLS_NEW={clients:["role","zalo","region","address","priority","signed_date","next_action","next_date","last_contact"],entries:["method","installment","tax"]};
const colsFor=t=>{const base=S.needMigration?COLS_BASE[t]:[...COLS_BASE[t],...(t==="entries"?[]:COLS_NEW[t]||[]),...(t==="clients"&&!S.needJourney?["journey"]:[])];const b2=t==="clients"?[...base,...(!S.needLinks?["drive_url"]:[]),...(!S.needTags?["tags"]:[])]:base;return t==="entries"&&!S.needFinance?[...b2,...COLS_NEW.entries]:b2};
const MAP={driveUrl:"drive_url",contractValue:"contract_value",updatedAt:"updated_at",clientId:"client_id",createdAt:"created_at",by:"created_by_email",signedDate:"signed_date",nextAction:"next_action",nextDate:"next_date",lastContact:"last_contact"};
const INV=Object.fromEntries(Object.entries(MAP).map(([a,b])=>[b,a]));
const DATE_COLS=new Set(["date","signed_date","next_date","last_contact","client_id"]);
function toRow(t,o){const r={},cols=colsFor(t);for(const [k,v] of Object.entries(o)){if(v===undefined)continue;const c=MAP[k]||k;if(!cols.includes(c))continue;r[c]=(v===""&&DATE_COLS.has(c))?null:v}return r}
function fromRow(r){const o={};for(const [k,v] of Object.entries(r))o[INV[k]||k]=v??"";o.amount=Number(r.amount||0);o.contractValue=Number(r.contract_value||0);o.tax=Number(r.tax||0);o.installment=Number(r.installment||0);o.method=r.method||"";o.journey=Array.isArray(r.journey)?r.journey:[];o.tags=Array.isArray(r.tags)?r.tags:[];return o}
function dbErr(error){console.error(error);if(error.code==="23503")return {code:"fk"};if(error.code==="42501"||/row-level security|permission/i.test(error.message||""))return {code:"invalid_argument"};return {code:"unavailable"}}
const db={
  async insert(t,d){const {error}=await sb.from(t).insert(toRow(t,d));if(error)throw dbErr(error);await reload()},
  async update(t,id,d){const {error}=await sb.from(t).update(toRow(t,d)).eq("id",id);if(error)throw dbErr(error);await reload()},
  async remove(t,id){const {error}=await sb.from(t).delete().eq("id",id);if(error)throw dbErr(error);await reload()}
};
async function reload(){
  if(S.quiet||!S.db)return;
  const [c,e,a,dc,fx,lk]=await Promise.all([sb.from("clients").select("*"),sb.from("entries").select("*").order("date",{ascending:false}).limit(5000),sb.from("activities").select("*").order("date",{ascending:false}).limit(5000),sb.from("documents").select("*").order("created_at",{ascending:false}).limit(5000),sb.from("entries").select("method,installment,tax").limit(1),sb.from("documents").select("url").limit(1)]);
  if(c.error||e.error){toast("Chưa tải được dữ liệu, thử tải lại trang");return}
  S.needMigration=!!a.error||!c.data.length?!!a.error:!("next_date" in c.data[0]);S.needJourney=S.needMigration||(c.data.length?!("journey" in c.data[0]):false);
  S.clients=new Map(c.data.map(r=>[r.id,fromRow(r)]));S.entries=e.data.map(fromRow);S.acts=a.error?[]:a.data.map(fromRow);S.needDocs=!!dc.error;S.needFinance=!!fx.error;S.needTags=c.data.length?!("tags" in c.data[0]):false;S.needLinks=!!lk.error||(c.data.length?!("drive_url" in c.data[0]):false);S.docs=dc.error?[]:dc.data.map(r=>({...fromRow(r),docDate:r.doc_date||"",size:Number(r.size)||0}));
  if($("#modal").innerHTML){closeModal.dirty=true;return}
  render();
}
let rt=null,rtTimer=null;
async function onSession(session){
  if(session){S.db=db;S.needLogin=false;S.uid=session.user.email;await reload();render();
    if(!rt)rt=sb.channel("hpg").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(reload,500)}).subscribe();}
  else{S.db=null;S.needLogin=true;S.clients=new Map();S.entries=[];S.acts=[];S.docs=[];if(rt){sb.removeChannel(rt);rt=null}$("#modal").innerHTML="";$("#root").innerHTML="";render()}
}
async function login(){const err=$("#lErr");err.textContent="";const {error}=await sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lPass").value});if(error)err.textContent=/invalid/i.test(error.message)?"Sai email hoặc mật khẩu.":"Chưa đăng nhập được: "+error.message}
(async()=>{
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||/DIEN_/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)||!window.supabase){S.setup=true;render();return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();await onSession(data.session);
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="SIGNED_IN"&&!S.db)onSession(session);if(ev==="SIGNED_OUT")onSession(null)});
})();
render();
</script>
</body>
</html>
