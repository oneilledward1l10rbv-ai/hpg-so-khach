<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HPG CRM</title>
<meta name="theme-color" content="#13284F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313284F'/%3E%3Cg transform='translate(14 10) scale(0.081)' fill='%23C4986A'%3E%3Cpath d='M7 9H116V598L7 675Z M187 87H262V415L187 468Z M336 9H444V364L336 441Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar navy cố định + vùng làm việc sáng; vàng gold chỉ dùng cho nhận diện và điểm nhấn */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EEF1F6; --line:#DDE3EC; --line-2:#C9D2DF;
  --ink:#0F1B33; --muted:#5B6780; --faint:#8A94A8;
  --navy:#13284F; --navy-2:#1B3463; --navy-ink:#C9D3E6;
  --accent:#1F3F7A; --accent-ink:#FFFFFF; --accent-soft:#E3EAF6;
  --gold:#C4986A; --gold-ink:#8A6230; --gold-soft:#F6EEE3;
  --pos:#1E7A4F; --pos-soft:#E1F2E9; --neg:#B4382A; --neg-soft:#F9E3E0;
  --warn:#9A6500; --warn-soft:#FBF0D9; --idle:#6B7488; --idle-soft:#E9ECF2;
  --c-thu:#2F5597; --c-chi:#C08A4E;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 2px 8px rgba(15,27,51,.04);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --side:236px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121C30; --sunk:#0E1728; --line:#22304A; --line-2:#2E3E5C;
  --ink:#E6EBF5; --muted:#93A0B8; --faint:#6D7A93;
  --navy:#0A1630; --navy-2:#13254A; --navy-ink:#AEBBD3;
  --accent:#7FA2E0; --accent-ink:#0B1220; --accent-soft:#1A2A4A;
  --gold:#D2A877; --gold-ink:#D9B285; --gold-soft:#2E2516;
  --pos:#4FC08A; --pos-soft:#12301F; --neg:#EE8A7A; --neg-soft:#3A1E1B;
  --warn:#E2B44F; --warn-soft:#33280F; --idle:#97A0B3; --idle-soft:#1E2738;
  --c-thu:#5F8BD6; --c-chi:#C2853F;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121C30; --sunk:#0E1728; --line:#22304A; --line-2:#2E3E5C;
  --ink:#E6EBF5; --muted:#93A0B8; --faint:#6D7A93;
  --navy:#0A1630; --navy-2:#13254A; --navy-ink:#AEBBD3;
  --accent:#7FA2E0; --accent-ink:#0B1220; --accent-soft:#1A2A4A;
  --gold:#D2A877; --gold-ink:#D9B285; --gold-soft:#2E2516;
  --pos:#4FC08A; --pos-soft:#12301F; --neg:#EE8A7A; --neg-soft:#3A1E1B;
  --warn:#E2B44F; --warn-soft:#33280F; --idle:#97A0B3; --idle-soft:#1E2738;
  --c-thu:#5F8BD6; --c-chi:#C2853F;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.code{font-family:var(--f-code);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.sub{display:block;font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- khung ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;color:#fff;text-decoration:none}
.logo svg{width:26px;height:40px;color:var(--gold);flex:none}
.logo b{display:block;font-size:14px;letter-spacing:.28em;font-weight:700;color:var(--gold)}
.logo span{display:block;font-size:11px;letter-spacing:.16em;color:var(--navy-ink);text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:rgba(201,211,230,.55);padding:14px 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--navy-ink);padding:9px 10px;border-radius:8px;text-align:left;font-weight:500;position:relative}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:12px;color:var(--navy-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot button{border:1px solid rgba(255,255,255,.14);background:none;color:var(--navy-ink);border-radius:8px;padding:6px 10px;font-size:12.5px;text-align:left}
.side-foot button:hover{color:#fff;border-color:rgba(255,255,255,.3)}

.main{min-width:0;display:flex;flex-direction:column}
.page{width:100%;max-width:1240px;margin:0 auto;padding-block:26px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:15;height:auto;flex-direction:row;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));overflow:hidden}
  .logo{padding:0 6px 0 0}.logo svg{width:18px;height:28px}.logo span{display:none}.logo b{font-size:12px;letter-spacing:.22em}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .nav .grp{display:none}
  .nav button{width:auto;white-space:nowrap;padding:7px 10px;font-size:13px}
  .nav button svg{display:none}
  .nav button[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:0;width:auto;height:2px;border-radius:2px}
  .side-foot{display:none}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
  .ph h1{font-size:19px}
  .m-only{display:inline-flex!important}
}
.m-only{display:none!important}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1205}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--neg)}
.btn.danger.arm{background:var(--neg);border-color:var(--neg);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.ctl{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
select.ctl{width:auto}
textarea.ctl{resize:vertical;min-height:70px}
.ctl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .ctl{flex:1 1 170px;width:auto}
.filters .grow{flex:3 1 240px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px 0}
.card-h h2{margin:0;font-size:14.5px;font-weight:600}
.card-h p{margin:0;color:var(--muted);font-size:12.5px}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 18px 18px}
.row{display:grid;gap:20px;align-items:start}
.r-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.r-12{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media (max-width:1060px){.r-2,.r-21,.r-12{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--navy);border-color:color-mix(in srgb,var(--gold) 35%,var(--navy));color:#fff}
.kpi.hl .l,.kpi.hl .s{color:var(--navy-ink)}
.kpi.hl .v{color:var(--gold)}
.delta{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.delta.up{background:var(--pos-soft);color:var(--pos)} .delta.dn{background:var(--neg-soft);color:var(--neg)}
.kpi.alert .v{color:var(--neg)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>:last-child:nth-child(odd){grid-column:1/-1}.kpi .v{font-size:19px}}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0;background:var(--sunk)}
.card .tbl-wrap{border-top:1px solid var(--line);margin-top:14px}
.card .tbl-wrap:first-child{border-top:0;margin-top:0}
.cell-main{font-weight:500}

/* ---------- chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--idle-soft);color:var(--idle)}
.pill.st-new{background:var(--accent-soft);color:var(--accent)}
.pill.st-wait{background:var(--warn-soft);color:var(--warn)}
.pill.st-won{background:var(--pos-soft);color:var(--pos)}
.pill.thu{background:var(--accent-soft);color:var(--accent)}
.pill.chi{background:var(--gold-soft);color:var(--gold-ink)}
.pri-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.pri-dot.p-hot{background:var(--neg)}.pri-dot.p-warm{background:var(--warn)}.pri-dot.p-cold{background:var(--c-thu)}
.due{font-size:12px;font-weight:600;white-space:nowrap}
.due.over{color:var(--neg)}.due.today{color:var(--warn)}.due.soon{color:var(--accent)}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:11px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px}
.barrow .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.barrow .fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.f-won{background:var(--pos)}.fill.f-off{background:var(--idle)}.fill.f-chi{background:var(--c-chi)}.fill.f-gold{background:var(--gold)}

/* ---------- charts ---------- */
.chart-wrap{overflow-x:auto}.chart{width:100%;min-width:520px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .grid.base{stroke:var(--line-2)}
.chart .ax{fill:var(--faint);font-size:10px;font-variant-numeric:tabular-nums}.chart .lbl{fill:var(--ink);font-size:11px;font-weight:600}
.s-thu{fill:var(--c-thu);background:var(--c-thu)}.s-chi{fill:var(--c-chi);background:var(--c-chi)}.s-pos{fill:var(--accent)}.s-neg{fill:var(--neg)}
.chart .hit{fill:transparent}.chart .hit:hover{fill:var(--ink);fill-opacity:.04}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}
i.k{display:inline-block;width:10px;height:10px;border-radius:3px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:12px;display:grid;grid-template-columns:auto auto;gap:3px 16px;box-shadow:0 6px 20px rgba(15,27,51,.16);max-width:270px}
.tip>b:first-child{grid-column:1/-1;margin-bottom:2px}.tip span{color:var(--muted);display:inline-flex;align-items:center;gap:6px}.tip .num{text-align:right}

/* ---------- tasks ---------- */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t-main{min-width:0}
.task .t-main b{font-weight:600}
.task .t-what{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task .t-meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.task .t-act{display:flex;gap:6px;align-items:center}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--sunk);border-top:1px solid var(--line);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grp-h:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.grp-h .n{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.grp-h.over{color:var(--neg)}.grp-h.today{color:var(--warn)}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:200px}
.col-h{padding:12px 14px 10px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.col-h b{font-size:13px;display:flex;align-items:center;gap:8px}
.col-h b .n{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.col-h span{font-size:12px;color:var(--muted)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--line-2)}
.kcard.drag{opacity:.5}
.kcard .k1{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;min-width:0}
.kcard .k1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .k2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .k3{display:flex;justify-content:space-between;gap:8px;font-size:12px;align-items:center}
.kcard .k3 b{font-weight:600}

/* ---------- empty ---------- */
.empty{padding:34px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:15px}
.empty .ico{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center}
.empty .ico svg{width:22px;height:22px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,16,32,.5);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(28px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 28px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:640px;border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(8,16,32,.3)}
.sheet.wide{max-width:980px}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-h h3{margin:0;font-size:16px;margin-right:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--sunk);border-radius:0 0 14px 14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.form label .ctl{color:var(--ink);font-weight:400;font-size:14px}
.form .hint{font-size:12px;color:var(--faint);font-weight:400}
.form .sec-t{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-ink);font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.form .sec-t:first-child{border-top:0;padding-top:0;margin-top:0}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:9px;font-weight:600;color:var(--muted)}
.seg button.on-thu{background:var(--accent-soft);color:var(--accent)}
.seg button.on-chi{background:var(--gold-soft);color:var(--gold-ink)}

.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
@media (max-width:820px){.detail{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.facts span{font-size:11.5px;color:var(--muted)}
.facts b{font-size:16px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px}
.info dt{color:var(--muted)}.info dd{margin:0;overflow-wrap:anywhere}
.next{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.next .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-ink);font-weight:700}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.h3 .r{margin-left:auto}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.ev{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.ev::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--line-2)}
.ev:last-child::before{display:none}
.ev .dot{width:13px;height:13px;border-radius:50%;border:3px solid var(--surface);background:var(--accent);box-shadow:0 0 0 1px var(--line-2);margin-top:3px}
.ev .dot.money{background:var(--gold)}
.ev .e-h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--muted)}
.ev .e-h b{color:var(--ink);font-size:13px}
.ev .e-b{font-size:13px;overflow-wrap:anywhere}
.ev .e-r{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:70;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(8,16,32,.3)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 16px;font-size:13px;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
code.k{font-family:var(--f-code);font-size:11.5px;background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--ink)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-brand{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;justify-content:space-between;padding:48px max(40px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.login-brand .mark{width:74px;height:114px;color:var(--gold)}
.login-brand h2{color:#fff;font-size:30px;line-height:1.25;margin:28px 0 10px;font-weight:700;letter-spacing:-.01em;max-width:440px;text-wrap:balance}
.login-brand p{margin:0;max-width:420px;font-size:14px}
.login-brand .word{font-size:15px;letter-spacing:.42em;color:var(--gold);font-weight:700}
.login-brand .bgmark{position:absolute;right:-60px;bottom:-80px;width:380px;height:580px;color:rgba(196,152,106,.07)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px max(24px,env(safe-area-inset-right,0px)) 40px 24px;background:var(--bg)}
.login-form form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.login-form h1{margin:0;font-size:22px}
.login-form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.login-form .err{color:var(--neg);font-size:13px;min-height:1.2em}
.login-form .btn{justify-content:center;padding:11px}
@media (max-width:820px){.login-wrap{grid-template-columns:minmax(0,1fr)}.login-brand{padding:28px 20px}.login-brand h2{font-size:22px;margin-top:16px}.login-brand .bgmark{display:none}.login-brand .mark{width:40px;height:62px}}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(10px);opacity:.6}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hpg-mark" viewBox="770 330 452 682"><path fill="currentColor" d="M777 339H886V928L777 1005Z M957 417H1032V745L957 798Z M1106 339H1214V694L1106 771Z"/></symbol>
</svg>
<div id="root"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<div id="tip" class="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ============ danh mục ============ */
const STATUSES=["1. Mới tiếp nhận","2. Đã liên hệ","3. Đang tư vấn","4. Đã gửi báo giá","5. Chờ quyết định","6. Đã ký hợp đồng","7. Đang triển khai","8. Hoàn thành","9. Tạm dừng","10. Không chốt"];
const SIGNED=new Set(["6. Đã ký hợp đồng","7. Đang triển khai","8. Hoàn thành"]);
const CLOSED=new Set(["8. Hoàn thành","9. Tạm dừng","10. Không chốt"]);
const OPEN_DEAL=s=>/^[1-5]\./.test(s||"");
const MODELS=["Phòng khám chuyên khoa","Phòng khám đa khoa","Phòng khám thẩm mỹ","Bệnh viện thẩm mỹ","Spa / Thẩm mỹ viện","Nha khoa","Phòng chẩn trị YHCT","Phòng khám YHCT","Phòng khám da liễu","Bác sĩ cá nhân","Nhà đầu tư (chưa có cơ sở)","Khác"];
const SERVICES=["Pháp lý - Thành lập cơ sở","Pháp lý - Giấy phép hoạt động","Pháp lý + Marketing","Bác sĩ đứng tên chuyên môn","Cố vấn pháp lý sau thành lập","Marketing Facebook","Marketing TikTok","Marketing FB + TikTok","Gói lẻ / Gói tuần Marketing","Kèm cặp / Cố vấn Marketing","Kế toán - Thuế","Khác"];
const OWNERS_BASE=["Sake","PTK"];
const ownerList=()=>[...new Set([...OWNERS_BASE,...[...S.clients.values()].map(c=>c.owner).filter(Boolean)])];
const PRIORITIES=["Nóng","Ấm","Lạnh"];
const ROLES=["Chủ phòng khám","Bác sĩ","Nhà đầu tư","Chủ spa","Quản lý","Khác"];
const REGIONS=["TP.HCM","Hà Nội","Đà Nẵng","Cần Thơ","Đồng Nai","Tây Ninh","An Giang","Vũng Tàu","Tỉnh khác"];
const SOURCES=["Facebook Ads","TikTok","Fanpage / Inbox","Zalo","Website","Giới thiệu","Khách cũ","Sự kiện / Hội thảo","Telesale","Khác"];
const CHANNELS=["Gọi điện","Zalo","Gặp trực tiếp","Inbox Facebook","Email","Họp online"];
const CAT_THU=["Đặt cọc / tạm ứng","Thanh toán theo đợt","Tất toán hợp đồng","Phí phát sinh thêm","Thu khác"];
const CAT_CHI=["Lệ phí nhà nước / hồ sơ","Ngân sách quảng cáo","Hoa hồng / chi phí đối tác","Chi phí nội bộ (lương, đi lại, in ấn)","Thuế / VAT","Chi khác"];

const S={view:"dashboard",period:"all",clients:new Map(),entries:[],acts:[],q:"",fStatus:"",fOwner:"",fPri:"",fSvc:"",tOwner:"",lf:{type:"",cat:"",client:""},
  db:null,uid:null,canWrite:true,names:{},needLogin:false,setup:false,needMigration:false,quiet:false};

/* ============ tiện ích ============ */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n||0).toLocaleString("vi-VN");
const fmtM=n=>{const a=Math.abs(n||0);if(a>=1e9)return (n/1e9).toLocaleString("vi-VN",{maximumFractionDigits:2})+" tỷ";if(a>=1e6)return (n/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr";return fmt(n)+" đ"};
const shortM=n=>{const a=Math.abs(n);if(a>=1e9)return (n/1e9).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tỷ";if(a>=1e6)return Math.round(n/1e6).toLocaleString("vi-VN")+" tr";if(a>=1e3)return Math.round(n/1e3)+"k";return String(Math.round(n))};
const todayISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dmy=iso=>iso?String(iso).slice(0,10).split("-").reverse().join("/"):"";
const dm=iso=>iso?dmy(iso).slice(0,5):"";
const ICON={
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  pipe:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  ledger:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>',
  report:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  io:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'
};
const ico=(n,cls="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${ICON[n]}</svg>`;
const mark=cls=>`<svg class="${cls}" aria-hidden="true"><use href="#hpg-mark"/></svg>`;

function parseMoney(v){
  if(typeof v==="number")return v;
  let s=String(v||"").toLowerCase().replace(/\s|đ|vnđ|vnd/g,"");if(!s)return 0;
  const m=s.match(/^([\d.,]+)(tỷ|ty|tr|triệu|trieu|m|k|nghìn|ngàn)?$/);
  if(m&&m[2]){const n=parseFloat(m[1].replace(",","."));const mul={"tỷ":1e9,"ty":1e9,"tr":1e6,"triệu":1e6,"trieu":1e6,"m":1e6,"k":1e3,"nghìn":1e3,"ngàn":1e3}[m[2]];return isNaN(n)?0:Math.round(n*mul)}
  const d=s.replace(/[^\d]/g,"");return d?parseInt(d,10):0;
}
function parseDate(v){v=String(v||"").trim();if(!v)return "";let m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
function stClass(s){if(SIGNED.has(s))return "st-won";if(/^[45]\./.test(s||""))return "st-wait";if(/^(9|10)\./.test(s||""))return "";return "st-new"}
const priCls=p=>p==="Nóng"?"p-hot":p==="Ấm"?"p-warm":p==="Lạnh"?"p-cold":"";
function dueInfo(d){if(!d)return null;const t=todayISO();if(d<t)return {cls:"over",txt:"Quá hạn "+dm(d)};if(d===t)return {cls:"today",txt:"Hôm nay"};if(d<=addDays(t,7))return {cls:"soon",txt:dm(d)};return {cls:"",txt:dm(d)}}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}
function clientName(id){if(!id)return "Chi phí chung";const c=S.clients.get(id);if(!c)return id;return (c.facility&&!/chưa có tên/i.test(c.facility))?c.facility:(c.contact||id)}
const opt=(arr,v,blank)=>(blank!==undefined?`<option value="">${blank}</option>`:"")+arr.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");
const sortedClients=()=>[...S.clients.values()].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));

/* ============ tính toán ============ */
const inPeriod=d=>S.period==="all"||String(d||"").startsWith(S.period);
function aggregate(){const per={},cats={};let thu=0,chi=0;for(const e of S.entries){if(!inPeriod(e.date))continue;const k=e.clientId||"";per[k]??={thu:0,chi:0};if(e.type==="thu"){per[k].thu+=e.amount;thu+=e.amount}else{per[k].chi+=e.amount;chi+=e.amount;const c=e.category||"Chi khác";cats[c]=(cats[c]||0)+e.amount}}return {per,cats,thu,chi}}
function allTime(){const per={};for(const e of S.entries){const k=e.clientId||"";per[k]??={thu:0,chi:0};per[k][e.type==="thu"?"thu":"chi"]+=e.amount}return per}
function oweList(){const at=allTime();return [...S.clients.values()].filter(c=>SIGNED.has(c.status)&&(c.contractValue||0)>(at[c.id]?.thu||0)).map(c=>({c,paid:at[c.id]?.thu||0,left:(c.contractValue||0)-(at[c.id]?.thu||0)})).sort((a,b)=>b.left-a.left)}
function monthSum(m){let thu=0,chi=0;for(const e of S.entries){if(!String(e.date).startsWith(m))continue;e.type==="thu"?thu+=e.amount:chi+=e.amount}return {thu,chi}}
const prevMonth=m=>{let [y,mo]=m.split("-").map(Number);mo--;if(!mo){mo=12;y--}return `${y}-${String(mo).padStart(2,"0")}`};
function taskGroups(owner){
  const t=todayISO(),wk=addDays(t,7);const g={over:[],today:[],week:[],later:[],none:[]};
  for(const c of S.clients.values()){if(CLOSED.has(c.status))continue;if(owner&&(c.owner||"")!==owner)continue;
    const d=c.nextDate;if(!d)g.none.push(c);else if(d<t)g.over.push(c);else if(d===t)g.today.push(c);else if(d<=wk)g.week.push(c);else g.later.push(c)}
  const byD=(a,b)=>(a.nextDate||"").localeCompare(b.nextDate||"")||a.id.localeCompare(b.id);Object.values(g).forEach(a=>a.sort(byD));return g;
}
const periodLabel=()=>S.period==="all"?"toàn bộ thời gian":S.period.length===4?"năm "+S.period:"tháng "+S.period.slice(5)+"/"+S.period.slice(0,4);
function periodSelect(){
  const months=[...new Set([...S.entries.map(e=>String(e.date||"").slice(0,7)),...[...S.clients.values()].map(c=>String(c.date||"").slice(0,7))].filter(Boolean))].sort().reverse();
  const cur=todayISO().slice(0,7);if(!months.includes(cur))months.unshift(cur);const years=[...new Set(months.map(m=>m.slice(0,4)))];
  const o=[["all","Toàn bộ thời gian"],...years.map(y=>[y,"Năm "+y]),...months.map(m=>[m,"Tháng "+m.slice(5)+"/"+m.slice(0,4)])];
  return `<select class="ctl" id="period" aria-label="Kỳ báo cáo">${o.map(([v,l])=>`<option value="${v}"${v===S.period?" selected":""}>${l}</option>`).join("")}</select>`;
}

/* ============ khung & điều hướng ============ */
const NAV=[["Tổng quan",[["dashboard","Dashboard","dash"],["tasks","Việc cần làm","task"]]],["Bán hàng",[["pipeline","Pipeline","pipe"],["clients","Khách hàng","users"]]],["Tài chính",[["ledger","Sổ thu chi","ledger"],["reports","Báo cáo lợi nhuận","report"]]],["Dữ liệu",[["io","Nhập / xuất file","io"]]]];
function render(){
  const root=$("#root");
  if(S.setup){root.innerHTML=`<div class="page"><div class="card empty"><b>Chưa cấu hình cơ sở dữ liệu</b><span>Điền SUPABASE_URL và SUPABASE_ANON_KEY vào file config.js theo hướng dẫn trong README.</span></div></div>`;return}
  if(S.needLogin){renderLogin();return}
  if(!S.db){root.innerHTML=`<div class="page"><div class="empty"><b>Đang mở HPG CRM…</b></div></div>`;return}
  const g=taskGroups("");const due=g.over.length+g.today.length;
  if(!$(".app")){root.innerHTML=`<div class="app"><aside class="side"><a class="logo" href="#" data-view="dashboard">${mark("")}<div><b>H&amp;P GROUP</b><span>CRM</span></div></a><nav class="nav" id="nav"></nav><div class="side-foot"><span class="who" id="who"></span><button type="button" id="btnLogout">Đăng xuất</button></div></aside><main class="main"><div class="page" id="page"></div></main></div>`}
  $("#nav").innerHTML=NAV.map(([grp,items])=>`<div class="grp">${grp}</div>`+items.map(([v,l,i])=>`<button type="button" data-view="${v}" ${S.view===v?'aria-current="page"':""}>${ico(i)}<span>${l}</span>${v==="tasks"&&due?`<span class="badge">${due}</span>`:""}</button>`).join("")).join("")+`<button type="button" class="m-only" id="btnLogoutM">Đăng xuất</button>`;
  $("#who").textContent=S.uid||"";
  const banner=S.needMigration?`<div class="banner"><b>Cần nâng cấp cơ sở dữ liệu.</b> Mở Supabase → SQL Editor, chạy file <code class="k">supabase/migration-2.sql</code> trong kho GitHub để bật Nhật ký chăm sóc, Việc cần làm và các trường mới.</div>`:"";
  $("#page").innerHTML=banner+({dashboard:vDashboard,tasks:vTasks,pipeline:vPipeline,clients:vClients,ledger:vLedger,reports:vReports,io:vIO}[S.view]||vDashboard)();
}
function renderLogin(){
  $("#root").innerHTML=`<div class="login-wrap"><section class="login-brand">${mark("bgmark")}<div>${mark("mark")}<h2>Quản lý khách hàng, hợp đồng và lợi nhuận ở một nơi.</h2><p>Hệ thống nội bộ của H&amp;P Group cho dịch vụ pháp lý y tế và marketing phòng khám.</p></div><div class="word">H&amp;P GROUP</div></section>
  <section class="login-form"><form id="fLogin"><h1>Đăng nhập HPG CRM</h1><label>Email<input class="ctl" id="lEmail" type="email" autocomplete="username" required></label><label>Mật khẩu<input class="ctl" id="lPass" type="password" autocomplete="current-password" required></label><span class="err" id="lErr"></span><button class="btn pri" type="submit">Đăng nhập</button><span class="sub">Tài khoản do quản trị viên cấp. Quên mật khẩu, nhắn quản trị viên để đặt lại.</span></form></section></div>`;
}
const pageHead=(title,sub,act="")=>`<header class="ph"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div><div class="act">${act}</div></header>`;
const btnEntry=`<button class="btn" type="button" data-act="add-entry">${ico("plus")}Ghi thu / chi</button>`;
const btnClient=`<button class="btn pri" type="button" data-act="add-client">${ico("plus")}Thêm khách</button>`;
const emptyBox=(icon,title,text,btn="")=>`<div class="empty"><div class="ico">${ico(icon)}</div><b>${title}</b><span>${text}</span>${btn}</div>`;

/* ============ charts ============ */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function last12(){const end=todayISO().slice(0,7);const latest=S.entries.reduce((m,e)=>e.date&&String(e.date).slice(0,7)>m?String(e.date).slice(0,7):m,end);let [y,m]=latest.split("-").map(Number);const out=[];for(let i=0;i<12;i++){out.unshift(`${y}-${String(m).padStart(2,"0")}`);m--;if(!m){m=12;y--}}return out}
const barPath=(x,y,w,h,up)=>{const r=Math.min(4,w/2,Math.abs(h));if(h<=0)return "";return up?`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`:`M${x},${y}V${y+h-r}Q${x},${y+h} ${x+r},${y+h}H${x+w-r}Q${x+w},${y+h} ${x+w},${y+h-r}V${y}Z`};
function chartMonthly(months,byM){
  const W=760,H=250,L=50,R=20,T=14,B=26,pw=W-L-R,ph=H-T-B;const max=niceMax(Math.max(1,...months.map(m=>Math.max(byM[m].thu,byM[m].chi))));
  const gw=pw/months.length,bw=Math.min(16,(gw-12)/2);let g="";
  for(let i=0;i<=4;i++){const v=max*i/4,y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid${i?"":" base"}"/><text x="${L-8}" y="${y+3.5}" text-anchor="end" class="ax">${shortM(v)}</text>`}
  let bars="",hits="";months.forEach((m,i)=>{const cx=L+gw*i+gw/2,d=byM[m],h1=ph*d.thu/max,h2=ph*d.chi/max;
    bars+=`<path d="${barPath(cx-bw-1,T+ph-h1,bw,h1,true)}" class="s-thu"/><path d="${barPath(cx+1,T+ph-h2,bw,h2,true)}" class="s-chi"/><text x="${cx}" y="${H-7}" text-anchor="middle" class="ax">${m.slice(5)}/${m.slice(2,4)}</text>`;
    hits+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ph}" class="hit" data-tip="${esc(`<b>Tháng ${m.slice(5)}/${m.slice(0,4)}</b><span><i class="k s-thu"></i>Thu</span><b class="num">${fmt(d.thu)}</b><span><i class="k s-chi"></i>Chi</span><b class="num">${fmt(d.chi)}</b><span>Lợi nhuận</span><b class="num">${fmt(d.thu-d.chi)}</b>`)}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Thu và chi theo tháng">${g}${bars}${hits}</svg>`;
}
function chartProfit(months,byM){
  const W=560,H=230,L=46,R=22,T=16,B=26,pw=W-L-R,ph=H-T-B;const vals=months.map(m=>byM[m].thu-byM[m].chi);const mx=niceMax(Math.max(1,...vals.map(Math.abs)));const neg=vals.some(v=>v<0);
  const lo=neg?-mx:0,yOf=v=>T+ph*(mx-v)/(mx-lo),zero=yOf(0);let g="";(neg?[-mx,0,mx]:[0,mx/2,mx]).forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${yOf(v)}" y2="${yOf(v)}" class="grid${v===0?" base":""}"/><text x="${L-8}" y="${yOf(v)+3.5}" text-anchor="end" class="ax">${shortM(v)}</text>`});
  const gw=pw/months.length,bw=Math.min(22,gw-12);let bars="",hits="";
  months.forEach((m,i)=>{const v=vals[i],cx=L+gw*i+gw/2,h=Math.abs(yOf(v)-zero);bars+=v>=0?`<path d="${barPath(cx-bw/2,zero-h,bw,h,true)}" class="s-pos"/>`:`<path d="${barPath(cx-bw/2,zero,bw,h,false)}" class="s-neg"/>`;
    if(i===months.length-1&&v)bars+=`<text x="${cx}" y="${v>=0?zero-h-6:zero+h+13}" text-anchor="middle" class="lbl">${shortM(v)}</text>`;
    bars+=`<text x="${cx}" y="${H-7}" text-anchor="middle" class="ax">${m.slice(5)}/${m.slice(2,4)}</text>`;
    hits+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ph}" class="hit" data-tip="${esc(`<b>Tháng ${m.slice(5)}/${m.slice(0,4)}</b><span>Lợi nhuận</span><b class="num">${fmt(v)}</b><span>Biên</span><b class="num">${byM[m].thu?(v/byM[m].thu*100).toFixed(0)+"%":"—"}</b>`)}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Lợi nhuận theo tháng">${g}${bars}${hits}</svg>`;
}

/* ============ VIEW: Báo cáo lợi nhuận ============ */
function vReports(){
  const a=aggregate(),at=allTime();const profit=a.thu-a.chi;const margin=a.thu?profit/a.thu*100:null;
  const cats=Object.entries(a.cats).sort((x,y)=>y[1]-x[1]);const mc=cats[0]?.[1]||1;
  const rows=Object.entries(a.per).map(([k,v])=>({k,...v,p:v.thu-v.chi,c:S.clients.get(k)})).sort((x,y)=>y.p-x.p);
  const svc={};for(const [k,v] of Object.entries(a.per)){const s=S.clients.get(k)?.service||(k?"Khác":"Chi phí chung");svc[s]??={thu:0,chi:0};svc[s].thu+=v.thu;svc[s].chi+=v.chi}
  return pageHead("Báo cáo lợi nhuận",periodLabel(),periodSelect())+`
  <section class="kpis k4">
    <div class="card kpi hl"><span class="l">Doanh thu</span><span class="v num">${fmtM(a.thu)}</span><span class="s num">${fmt(a.thu)} đ</span></div>
    <div class="card kpi"><span class="l">Chi phí</span><span class="v num">${fmtM(a.chi)}</span><span class="s num">${fmt(a.chi)} đ</span></div>
    <div class="card kpi"><span class="l">Lợi nhuận</span><span class="v num ${profit<0?"neg":""}">${fmtM(profit)}</span><span class="s">${margin==null?"Chưa có khoản thu":"Biên "+margin.toLocaleString("vi-VN",{maximumFractionDigits:1})+"%"}</span></div>
    <div class="card kpi"><span class="l">Còn phải thu</span><span class="v num">${fmtM(oweList().reduce((x,o)=>x+o.left,0))}</span><span class="s">Mọi thời điểm</span></div>
  </section>
  <div class="row r-12">
    <section class="card"><div class="card-h"><h2>Chi phí theo hạng mục</h2></div><div class="card-b">${cats.length?`<div class="bars">${cats.map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><span class="num">${fmt(v)} <span class="sub" style="display:inline">· ${(v/a.chi*100).toFixed(0)}%</span></span><div class="track"><div class="fill f-chi" style="width:${(v/mc*100).toFixed(1)}%"></div></div></div>`).join("")}</div>`:`<p class="sub">Chưa có khoản chi trong kỳ.</p>`}</div></section>
    <section class="card"><div class="card-h"><h2>Lợi nhuận theo dịch vụ</h2></div>
      <div class="tbl-wrap"><table style="min-width:480px"><thead><tr><th>Dịch vụ</th><th class="r">Thu</th><th class="r">Chi</th><th class="r">Lợi nhuận</th><th class="r">Biên</th></tr></thead><tbody>
      ${Object.entries(svc).sort((x,y)=>(y[1].thu-y[1].chi)-(x[1].thu-x[1].chi)).map(([k,v])=>`<tr><td class="cell-main">${esc(k)}</td><td class="r num">${fmt(v.thu)}</td><td class="r num">${fmt(v.chi)}</td><td class="r num ${v.thu-v.chi<0?"neg":""}">${fmt(v.thu-v.chi)}</td><td class="r num">${v.thu?((v.thu-v.chi)/v.thu*100).toFixed(0)+"%":"—"}</td></tr>`).join("")||`<tr><td colspan="5" class="sub">Chưa có dữ liệu.</td></tr>`}</tbody></table></div></section>
  </div>
  <section class="card"><div class="card-h"><h2>Lợi nhuận theo khách</h2><p>${periodLabel()}</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>Khách</th><th class="r">Giá trị HĐ</th><th class="r">Đã thu</th><th class="r">Chi phí</th><th class="r">Lợi nhuận</th><th class="r">Biên</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.k?"click":""}" ${r.k?`data-client="${esc(r.k)}"`:""}><td>${r.k?`<span class="code">${esc(r.k)}</span> `:""}<span class="cell-main">${esc(clientName(r.k))}</span><span class="sub">${r.c?esc(r.c.service||""):"Không gắn khách cụ thể"}</span></td><td class="r num">${r.c?.contractValue?fmt(r.c.contractValue):"—"}</td><td class="r num">${fmt(r.thu)}</td><td class="r num">${fmt(r.chi)}</td><td class="r num ${r.p<0?"neg":""}" style="font-weight:600">${fmt(r.p)}</td><td class="r num">${r.thu?(r.p/r.thu*100).toFixed(0)+"%":"—"}</td></tr>`).join("")||`<tr><td colspan="6" class="sub">Không có khoản nào trong kỳ.</td></tr>`}
    </tbody>${rows.length?`<tfoot><tr><td>Tổng</td><td></td><td class="r num">${fmt(a.thu)}</td><td class="r num">${fmt(a.chi)}</td><td class="r num">${fmt(profit)}</td><td class="r num">${margin==null?"—":margin.toFixed(0)+"%"}</td></tr></tfoot>`:""}</table></div></section>`;
}

/* ============ ghi chú → nhật ký ============ */
const NOTE_MARK="Từ ghi chú";
function guessChannel(t){t=t.toLowerCase();if(/inbox|trả lời qc|tin nhắn|fanpage|\bfb\b|gửi sđt/.test(t))return "Inbox Facebook";if(/họp|gặp|starbucks|cafe|cà phê|khảo sát/.test(t))return "Gặp trực tiếp";if(/gọi|nghe máy|cuộc gọi|điện thoại/.test(t))return "Gọi điện";if(/zalo/.test(t))return "Zalo";if(/email|mail/.test(t))return "Email";return "Ghi chú"}
function cleanSeg(t){return t.replace(/\s+/g," ").replace(/\(\s*\)/g,"").replace(/\s+([.,;:)])/g,"$1").replace(/^[\s.,;:→>\-–)]+|[\s,;:→>\-–(]+$/g,"").trim()}
function parseNote(note,refISO,fallbackISO){
  note=String(note||"").replace(/\r/g,"").trim();if(!note)return [];
  const yr=(refISO||fallbackISO||new Date().toISOString()).slice(0,4);
  const re=/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?(?![\d\/])/g;const hits=[];let m;
  while((m=re.exec(note))){const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)continue;
    const prevEnd=hits.length?hits[hits.length-1].tEnd:0;const before=note.slice(prevEnd,m.index);
    let cut=-1;for(const sp of [". ",".\n","; ","\n","→","->","|"]){const i=before.lastIndexOf(sp);if(i>=0)cut=Math.max(cut,i+sp.length)}
    let start=m.index;const lead=cut>=0?before.slice(cut):before;const endsClause=/^\s*([.;\n]|$)/.test(note.slice(re.lastIndex));if(lead.length<=24||endsClause)start=prevEnd+(cut>=0?cut:0);
    hits.push({start,tStart:m.index,tEnd:re.lastIndex,date:`${m[3]||yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`})}
  const out=[];const pre=cleanSeg(note.slice(0,hits.length?hits[0].start:note.length));
  hits.forEach((h,i)=>{const end=i+1<hits.length?hits[i+1].start:note.length;const txt=cleanSeg(note.slice(h.start,h.tStart)+" "+note.slice(h.tEnd,end));
    const last=out[out.length-1];if(last&&last.date===h.date){if(txt)last.content=cleanSeg(last.content+" · "+txt)}else out.push({date:h.date,content:txt})});
  if(pre)out.unshift({date:fallbackISO||(hits[0]?.date)||refISO,content:pre,undated:true});
  const merged=[];for(const o of out.filter(o=>o.content&&o.date)){const l=merged[merged.length-1];if(l&&l.date===o.date)l.content=cleanSeg(l.content+" · "+o.content);else merged.push({...o})}
  return merged.map(o=>({date:o.date,content:o.content,channel:guessChannel(o.content)}));
}
async function syncNoteActs(id,note,ref,last){
  if(S.needMigration)return 0;
  const items=parseNote(note,ref,last||ref);
  const {error:e1}=await sb.from("activities").delete().eq("client_id",id).eq("created_by_email",NOTE_MARK);if(e1)throw dbErr(e1);
  if(items.length){const {error:e2}=await sb.from("activities").insert(items.map((x,i)=>toRow("activities",{clientId:id,date:x.date,channel:x.channel,content:x.content,result:"",by:NOTE_MARK,createdAt:Date.now()+i})));if(e2)throw dbErr(e2)}
  return items.length;
}

}

/* ============ CSV ============ */
function parseCSV(text){text=text.replace(/^﻿/,"");const first=text.split("\n")[0];const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=""}else if(ch==="\n"){row.push(cur.replace(/\r$/,""));rows.push(row);row=[];cur=""}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows}
const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const findCol=(h,...keys)=>h.findIndex(x=>keys.some(k=>norm(x).startsWith(norm(k))));
async function importClients(text){
  const rows=parseCSV(text);const hi=rows.findIndex(r=>r.some(c=>norm(c)==="ma kh"));if(hi<0){toast("Không thấy cột “Mã KH” trong file");return}
  const h=rows[hi];const C={id:"Mã KH",date:"Ngày tiếp nhận",contact:"Tên người liên hệ",role:"Vai trò",status:"Tình trạng",model:"Mô hình",facility:"Tên cơ sở",phone:"Số điện thoại",priority:"Ưu tiên",zalo:"Zalo",region:"Khu vực",address:"Quận",service:"Dịch vụ",nextAction:"Việc cần làm",lastContact:"Liên hệ gần nhất",nextDate:"Hẹn liên hệ",value:"Giá trị",source:"Nguồn",note:"Ghi chú",owner:"Người phụ trách"};
  const col=Object.fromEntries(Object.entries(C).map(([k,v])=>[k,findCol(h,v)]));const g=(r,k)=>col[k]>=0?(r[col[k]]||"").trim():"";
  let n=0,u=0;S.quiet=true;
  try{for(const r of rows.slice(hi+1)){const id=g(r,"id").toUpperCase();if(!/^[A-Z0-9_-]+$/.test(id))continue;
    const d={date:parseDate(g(r,"date")),contact:g(r,"contact"),status:g(r,"status"),model:g(r,"model"),facility:g(r,"facility"),phone:g(r,"phone"),service:g(r,"service"),source:g(r,"source"),note:g(r,"note"),owner:g(r,"owner"),contractValue:parseMoney(g(r,"value"))};
    if(!S.needMigration)Object.assign(d,{role:g(r,"role"),priority:g(r,"priority"),zalo:/^đã kết nối/i.test(g(r,"zalo"))?"":g(r,"zalo"),region:g(r,"region"),address:g(r,"address"),nextAction:g(r,"nextAction"),lastContact:parseDate(g(r,"lastContact")),nextDate:parseDate(g(r,"nextDate"))});
    const old=S.clients.get(id);const clean=Object.fromEntries(Object.entries(d).filter(([,x])=>x!==""&&x!==0));
    if(old){if(old.contractValue)delete clean.contractValue;await db.update("clients",id,{...clean,updatedAt:Date.now()});u++}else{await db.insert("clients",{id,...d,updatedAt:Date.now()});n++}
    const note=d.note||old?.note||"";if(note)await syncNoteActs(id,note,d.date||old?.date,d.lastContact||old?.lastContact);}}
  catch(err){writeErr(err)}finally{S.quiet=false;await reload()}
  toast(`Đã nhập ${n} khách mới, cập nhật ${u} khách`);
}
async function importActs(text){
  if(S.needMigration){toast("Cần chạy file nâng cấp cơ sở dữ liệu trước");return}
  const rows=parseCSV(text);const hi=rows.findIndex(r=>findCol(r,"Nội dung")>=0&&findCol(r,"Mã KH")>=0);if(hi<0){toast("Không thấy cột “Mã KH” và “Nội dung” trong file");return}
  const h=rows[hi];const c={date:findCol(h,"Ngày"),id:findCol(h,"Mã KH"),ch:findCol(h,"Hình thức"),content:findCol(h,"Nội dung"),result:findCol(h,"Kết quả"),next:findCol(h,"Hẹn")};const g=(r,k)=>c[k]>=0?(r[c[k]]||"").trim():"";
  let n=0,skip=0;S.quiet=true;
  try{for(const r of rows.slice(hi+1)){const id=g(r,"id").toUpperCase();const content=g(r,"content");if(!S.clients.has(id)||!content){if(r.some(x=>x.trim()))skip++;continue}
    await db.insert("activities",{clientId:id,date:parseDate(g(r,"date"))||S.clients.get(id).date||todayISO(),channel:g(r,"ch"),content,result:g(r,"result"),nextDate:parseDate(g(r,"next")),by:S.uid,createdAt:Date.now()+n});n++}}
  catch(err){writeErr(err)}finally{S.quiet=false;await reload()}

}
async function importEntries(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()));const hi=rows.findIndex(r=>findCol(r,"Số tiền")>=0);if(hi<0){toast("Không thấy cột “Số tiền” trong file");return}
  const h=rows[hi];const c={date:findCol(h,"Ngày"),client:findCol(h,"Mã KH"),type:findCol(h,"Loại"),cat:findCol(h,"Hạng mục"),amt:findCol(h,"Số tiền"),note:findCol(h,"Nội dung","Ghi chú","Diễn giải")};const g=(r,k)=>c[k]>=0?(r[c[k]]||"").trim():"";
  let n=0,skip=0;S.quiet=true;
  try{for(const r of rows.slice(hi+1)){const amount=parseMoney(g(r,"amt")),date=parseDate(g(r,"date"));if(!amount||!date){skip++;continue}const type=/^thu/.test(norm(g(r,"type")))?"thu":"chi";const cid=g(r,"client").toUpperCase();
    await db.insert("entries",{type,date,clientId:S.clients.has(cid)?cid:"",category:g(r,"cat")||(type==="thu"?"Thu khác":"Chi khác"),amount,note:g(r,"note"),by:S.uid,createdAt:Date.now()+n});n++}}
  catch(err){writeErr(err)}finally{S.quiet=false;await reload()}
  toast(`Đã nhập ${n} khoản${skip?`, bỏ qua ${skip} dòng thiếu ngày hoặc số tiền`:""}`);
}
function handleFile(kind,file){if(!file)return;const fr=new FileReader();fr.onload=()=>({clients:importClients,entries:importEntries,acts:importActs}[kind])(fr.result);fr.readAsText(file,"utf-8")}
const csvCell=v=>{v=String(v??"");return /[",\n;]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
function saveCSV(name,rows){const blob=new Blob(["﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;if(id==="fLogin")login();if(id==="fEntry")saveEntry(e.target);if(id==="fClient")saveClient(e.target);if(id==="fLog")saveLog(e.target)});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==="eAmt"){const v=parseMoney(e.target.value);$("#eAmtHint").textContent=v?fmt(v)+" đ":"Gõ 3,5tr, 500k hoặc số đầy đủ"}
});
document.addEventListener("change",e=>{const id=e.target.id,v=e.target.value;
  const map={period:"period",fStatus:"fStatus",fOwner:"fOwner",fPri:"fPri",fSvc:"fSvc",tOwner:"tOwner"};
  if(map[id]){S[map[id]]=v;render()}
  if(id==="lfType"){S.lf.type=v;render()}if(id==="lfCat"){S.lf.cat=v;render()}if(id==="lfClient"){S.lf.client=v;render()}
  if(e.target.dataset.file)handleFile(e.target.dataset.file,e.target.files[0]);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});
/* kéo thả: file CSV + thẻ pipeline */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.("[data-card]");if(c){dragId=c.dataset.card;c.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId)}});
document.addEventListener("dragend",e=>{const c=e.target.closest?.("[data-card]");c&&c.classList.remove("drag");document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"))});
document.addEventListener("dragover",e=>{const col=e.target.closest?.("[data-col]");if(col&&dragId){e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over");return}const d=e.target.closest?.("[data-drop]");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest?.("[data-drop]");d&&d.classList.remove("over")});
document.addEventListener("drop",async e=>{
  const col=e.target.closest?.("[data-col]");
  if(col&&dragId){e.preventDefault();const id=dragId;dragId=null;col.classList.remove("over");const c=S.clients.get(id);const st=col.dataset.col;if(!c||c.status===st)return;
    const patch={status:st,updatedAt:Date.now()};if(!S.needMigration&&SIGNED.has(st)&&!c.signedDate)patch.signedDate=todayISO();
    c.status=st;render();try{await db.update("clients",id,patch);toast(`${id} → ${st}`)}catch(err){writeErr(err);reload()}return}
  const d=e.target.closest?.("[data-drop]");if(d){e.preventDefault();d.classList.remove("over");handleFile(d.dataset.drop,e.dataTransfer.files[0])}
});
/* tooltip biểu đồ */
const tipEl=$("#tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest?.("[data-tip]");if(!t){tipEl.hidden=true;return}tipEl.innerHTML=t.dataset.tip;tipEl.hidden=false;const r=tipEl.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;tipEl.style.left=x+"px";tipEl.style.top=y+"px"});
document.addEventListener("scroll",()=>tipEl.hidden=true,true);

/* ============ kết nối Supabase ============ */
const CFG=window.HPG_CONFIG||{};let sb=null;
const COLS_BASE={clients:["id","date","contact","phone","facility","model","service","status","owner","contract_value","source","note","updated_at"],entries:["id","type","date","client_id","category","amount","note","created_by_email","created_at","updated_at"],activities:["id","client_id","date","channel","content","result","next_date","created_by_email","created_at"]};
const COLS_NEW={clients:["role","zalo","region","address","priority","signed_date","next_action","next_date","last_contact"]};
const colsFor=t=>S.needMigration?COLS_BASE[t]:[...COLS_BASE[t],...(COLS_NEW[t]||[])];
const MAP={contractValue:"contract_value",updatedAt:"updated_at",clientId:"client_id",createdAt:"created_at",by:"created_by_email",signedDate:"signed_date",nextAction:"next_action",nextDate:"next_date",lastContact:"last_contact"};
const INV=Object.fromEntries(Object.entries(MAP).map(([a,b])=>[b,a]));
const DATE_COLS=new Set(["date","signed_date","next_date","last_contact","client_id"]);
function toRow(t,o){const r={},cols=colsFor(t);for(const [k,v] of Object.entries(o)){if(v===undefined)continue;const c=MAP[k]||k;if(!cols.includes(c))continue;r[c]=(v===""&&DATE_COLS.has(c))?null:v}return r}
function fromRow(r){const o={};for(const [k,v] of Object.entries(r))o[INV[k]||k]=v??"";o.amount=Number(r.amount||0);o.contractValue=Number(r.contract_value||0);return o}
function dbErr(error){console.error(error);if(error.code==="23503")return {code:"fk"};if(error.code==="42501"||/row-level security|permission/i.test(error.message||""))return {code:"invalid_argument"};return {code:"unavailable"}}
const db={
  async insert(t,d){const {error}=await sb.from(t).insert(toRow(t,d));if(error)throw dbErr(error);await reload()},
  async update(t,id,d){const {error}=await sb.from(t).update(toRow(t,d)).eq("id",id);if(error)throw dbErr(error);await reload()},
  async remove(t,id){const {error}=await sb.from(t).delete().eq("id",id);if(error)throw dbErr(error);await reload()}
};
async function reload(){
  if(S.quiet||!S.db)return;
  const [c,e,a]=await Promise.all([sb.from("clients").select("*"),sb.from("entries").select("*").order("date",{ascending:false}).limit(5000),sb.from("activities").select("*").order("date",{ascending:false}).limit(5000)]);
  if(c.error||e.error){toast("Chưa tải được dữ liệu, thử tải lại trang");return}
  S.needMigration=!!a.error||!c.data.length?!!a.error:!("next_date" in c.data[0]);
  S.clients=new Map(c.data.map(r=>[r.id,fromRow(r)]));S.entries=e.data.map(fromRow);S.acts=a.error?[]:a.data.map(fromRow);
  if($("#modal").innerHTML){closeModal.dirty=true;return}
  render();
}
let rt=null,rtTimer=null;
async function onSession(session){
  if(session){S.db=db;S.needLogin=false;S.uid=session.user.email;await reload();render();
    if(!rt)rt=sb.channel("hpg").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(reload,500)}).subscribe();}
  else{S.db=null;S.needLogin=true;S.clients=new Map();S.entries=[];S.acts=[];if(rt){sb.removeChannel(rt);rt=null}$("#modal").innerHTML="";$("#root").innerHTML="";render()}
}
async function login(){const err=$("#lErr");err.textContent="";const {error}=await sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lPass").value});if(error)err.textContent=/invalid/i.test(error.message)?"Sai email hoặc mật khẩu.":"Chưa đăng nhập được: "+error.message}
(async()=>{
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||/DIEN_/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)||!window.supabase){S.setup=true;render();return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();await onSession(data.session);
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="SIGNED_IN"&&!S.db)onSession(session);if(ev==="SIGNED_OUT")onSession(null)});
})();
render();
</script>
</body>
